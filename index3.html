<!DOCTYPE html>
<html lang="no" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madina Skole — Hovedportal</title>
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#1f4a3a">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Madina Skole">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Lora:ital,wght@0,400;0,500;0,600&family=Jost:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2c24; --emerald:#1f4a3a; --emerald-d:#0f2b21; --emerald-l:#2e6b53;
    --gold:#b7924a; --gold-l:#d9bd7c; --paper:#fbf8f1; --paper-2:#f3ecdb;
    --line:rgba(20,38,31,0.14); --shadow:0 10px 26px rgba(15,43,33,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Lora',serif; color:var(--ink); min-height:100vh;}
  html[dir="rtl"] body{font-family:'Tajawal','Lora',serif;}

  .lang-switch{display:flex; justify-content:center; gap:0; background:var(--emerald-d); padding:8px;}
  .lang-switch button{
    background:transparent; border:1px solid rgba(217,189,124,0.4); color:var(--gold-l);
    font-family:'Jost',sans-serif; font-size:11.5px; font-weight:600; letter-spacing:0.04em;
    padding:6px 16px; cursor:pointer;
  }
  .lang-switch button:first-child{border-radius:6px 0 0 6px;}
  .lang-switch button:last-child{border-radius:0 6px 6px 0;}
  .lang-switch button.active{background:var(--gold-l); color:var(--emerald-d); border-color:var(--gold-l);}
  html[dir="rtl"] .lang-switch button:first-child{border-radius:0 6px 6px 0;}
  html[dir="rtl"] .lang-switch button:last-child{border-radius:6px 0 0 6px;}

  header{
    background:linear-gradient(165deg,var(--emerald) 0%, var(--emerald-d) 100%);
    color:var(--paper); padding:34px 20px 28px; text-align:center; box-shadow:var(--shadow);
  }
  header .logo-img{height:56px; width:auto; border-radius:5px; margin:0 auto 12px; display:block;}
  header h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:26px; margin:0 0 6px;}
  html[dir="rtl"] header h1{font-family:'Tajawal',sans-serif; font-size:23px;}
  header p{font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-l); margin:0;}
  html[dir="rtl"] header p{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}

  main{max-width:480px; margin:0 auto; padding:26px 18px 60px;}

  .portal-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  a.portal-card{
    position:relative; background:#fff; border:1px solid var(--line); border-radius:12px; padding:24px 16px;
    box-shadow:var(--shadow); text-align:center; text-decoration:none; color:inherit;
    transition:border-color .2s, transform .2s;
  }
  a.portal-card:hover{border-color:var(--gold); transform:translateY(-3px);}
  a.portal-card .ic{font-size:32px; margin-bottom:10px;}
  a.portal-card .title{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:17px; color:var(--emerald-d); margin-bottom:5px; line-height:1.25;}
  html[dir="rtl"] a.portal-card .title{font-family:'Tajawal',sans-serif; font-size:15.5px;}
  a.portal-card .desc{font-family:'Jost',sans-serif; font-size:10.5px; color:#5a6860; line-height:1.4;}
  html[dir="rtl"] a.portal-card .desc{font-family:'Tajawal',sans-serif;}

  .foot-note{text-align:center; font-family:'Jost',sans-serif; font-size:10.5px; color:#8a978f; margin-top:30px; letter-spacing:0.05em;}
  html[dir="rtl"] .foot-note{font-family:'Tajawal',sans-serif; letter-spacing:0;}
</style>
</head>
<body>

<div class="lang-switch">
  <button id="btnLangNo" class="active" onclick="switchLang('no')">Norsk</button>
  <button id="btnLangAr" onclick="switchLang('ar')">العربية</button>
</div>

<header>
  <img src="https://madina-institute.github.io/Madina-Instituttet-/logo.png" alt="Madina Institute" class="logo-img">
  <h1 id="hTitle">Madina Skole</h1>
  <p id="hSub">Velg portal</p>
</header>

<main>
  <div class="portal-grid">
    <a class="portal-card" href="index.html">
      <div class="ic">🛡️</div>
      <div class="title" id="cAdminTitle">Administrativ</div>
      <div class="desc" id="cAdminDesc">For skolens administrasjon</div>
    </a>
    <a class="portal-card" href="index1.html">
      <div class="ic">📖</div>
      <div class="title" id="cLarerTitle">Lærerportal</div>
      <div class="desc" id="cLarerDesc">Kun for lærere</div>
    </a>
    <a class="portal-card" href="index4.html">
      <div class="ic">👨‍👩‍👧</div>
      <div class="title" id="cForeldreTitle">Foreldreportal</div>
      <div class="desc" id="cForeldreDesc">For foresatte</div>
    </a>
    <a class="portal-card" href="index2.html">
      <div class="ic">📝</div>
      <div class="title" id="cPameldingTitle">Påmelding</div>
      <div class="desc" id="cPameldingDesc">Meld på ditt barn</div>
    </a>
  </div>
  <div class="foot-note" id="fNote">Madina Islamske Skole</div>
</main>

<script>
  const HUB_TEXT = {
    no: {
      hSub: 'Velg portal', cAdminTitle: 'Administrativ', cAdminDesc: 'For skolens administrasjon',
      cLarerTitle: 'Lærerportal', cLarerDesc: 'Kun for lærere',
      cForeldreTitle: 'Foreldreportal', cForeldreDesc: 'For foresatte',
      cPameldingTitle: 'Påmelding', cPameldingDesc: 'Meld på ditt barn',
      fNote: 'Madina Islamske Skole'
    },
    ar: {
      hSub: 'اختر البوابة', cAdminTitle: 'الإدارة', cAdminDesc: 'لإدارة المدرسة',
      cLarerTitle: 'بوابة المعلم', cLarerDesc: 'للمعلمين فقط',
      cForeldreTitle: 'بوابة أولياء الأمور', cForeldreDesc: 'لأولياء الأمور',
      cPameldingTitle: 'التسجيل', cPameldingDesc: 'سجّل طفلك',
      fNote: 'مدرسة مدينة الإسلامية'
    }
  };

  function switchLang(lang){
    const t = HUB_TEXT[lang];
    document.getElementById('htmlRoot').setAttribute('lang', lang === 'ar' ? 'ar' : 'no');
    document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.getElementById('btnLangNo').classList.toggle('active', lang === 'no');
    document.getElementById('btnLangAr').classList.toggle('active', lang === 'ar');
    document.getElementById('hSub').textContent = t.hSub;
    document.getElementById('cAdminTitle').textContent = t.cAdminTitle;
    document.getElementById('cAdminDesc').textContent = t.cAdminDesc;
    document.getElementById('cLarerTitle').textContent = t.cLarerTitle;
    document.getElementById('cLarerDesc').textContent = t.cLarerDesc;
    document.getElementById('cForeldreTitle').textContent = t.cForeldreTitle;
    document.getElementById('cForeldreDesc').textContent = t.cForeldreDesc;
    document.getElementById('cPameldingTitle').textContent = t.cPameldingTitle;
    document.getElementById('cPameldingDesc').textContent = t.cPameldingDesc;
    document.getElementById('fNote').textContent = t.fNote;
    localStorage.setItem('madinaHubLang', lang);
  }

  (function(){
    const saved = localStorage.getItem('madinaHubLang');
    if(saved === 'ar') switchLang('ar');
  })();
</script>

</body>
</html>
