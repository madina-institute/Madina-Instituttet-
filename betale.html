<!DOCTYPE html>
<!-- SIST-ENDRET: 2026-08-22 17:35:00 -->
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betale faktura — Madina Skole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a2e24;
  --line: rgba(26,46,36,0.14);
  --paper: #fff;
  --muted: #5a6860;
  --brand: #1c5490;
  --vipps: #ff5b24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Jost', sans-serif;
  background: #f6f7f9;
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
  padding: 20px 16px 32px;
}
.wrap { max-width: 440px; margin: 0 auto; }
.top { text-align: center; margin-bottom: 18px; }
.top img { width: min(160px, 48vw); height: auto; margin-bottom: 8px; }
.top h1 { font-size: 20px; color: var(--brand); font-weight: 700; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px 18px;
  box-shadow: 0 6px 18px rgba(26,46,36,0.05);
}
.hero { text-align: center; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.hero .elev { font-size: 15px; color: var(--muted); margin-bottom: 4px; }
.hero .ref { font-size: 12px; color: #8a9690; letter-spacing: 0.02em; }
.hero .amt {
  font-size: 36px; font-weight: 800; color: var(--brand);
  margin: 8px 0 4px; line-height: 1.1;
}
.hero .meta { font-size: 13px; color: var(--muted); }
.hero.forfalt .amt { color: #8a2a2a; }
.hero.forfalt .badge {
  display: inline-block; margin-top: 8px; padding: 4px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 700;
  background: #fdecea; color: #8a2a2a;
}
.section-title {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: #8a9690; margin-bottom: 10px;
}
.amount-row { display: flex; gap: 8px; margin-bottom: 12px; }
.btn-choice {
  flex: 1; padding: 12px 10px; border-radius: 12px;
  border: 1px solid var(--line); background: #fff;
  font-family: inherit; font-size: 14px; font-weight: 600;
  color: var(--ink); cursor: pointer;
}
.btn-choice.selected { border-color: var(--brand); background: #eef6fd; color: var(--brand); }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.field input {
  width: 100%; padding: 12px; border-radius: 12px;
  border: 1px solid var(--line); font-size: 16px; font-family: inherit;
}
.field input.input-error { border-color: #d64545; background: #fff8f8; }
.field-error { margin-top: 6px; font-size: 12px; font-weight: 600; color: #8a2a2a; }
.pay-actions { display: grid; gap: 10px; margin-top: 4px; }
.btn-pay {
  width: 100%; padding: 15px 16px; border: none; border-radius: 12px;
  font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
}
.btn-vipps { background: var(--vipps); color: #fff; }
.btn-vipps:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-vipps .mark {
  background: #fff; color: var(--vipps); font-size: 11px; font-weight: 800;
  padding: 2px 7px; border-radius: 999px; margin-right: 6px;
}
.btn-card {
  background: var(--brand); color: #fff;
}
.btn-card:disabled { opacity: 0.55; cursor: not-allowed; }
.note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
.account-toggle {
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted);
}
.account-toggle summary { cursor: pointer; font-weight: 600; color: var(--brand); }
.account-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
  margin-top: 10px; font-size: 13px;
}
.account-grid .lbl { color: var(--muted); }
.account-grid .val { text-align: right; font-weight: 600; }
.msg {
  padding: 12px 14px; border-radius: 12px; font-size: 14px;
  margin-bottom: 14px; border: 1px solid var(--line);
}
.msg.error { background: #fdecea; color: #8a2a2a; border-color: #f5c6c6; }
.msg.info { background: #eef6fd; color: var(--brand); border-color: #cfe0ef; }
.hidden { display: none !important; }
.footer { text-align: center; margin-top: 18px; font-size: 12px; color: #8a9690; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="logo-bla.png" alt="Madina Skole">
    <h1>Betale faktura</h1>
  </div>
  <div id="statusMsg" class="msg info hidden"></div>
  <div id="mainCard" class="card hidden">
    <div class="hero" id="heroBlock">
      <div class="elev" id="elevLine">—</div>
      <div class="ref" id="refLine"></div>
      <div class="amt" id="payAmountDisplay">—</div>
      <div class="meta" id="metaLine"></div>
    </div>

    <div id="amountSection" class="hidden">
      <div class="section-title">Beløp</div>
      <div class="amount-row">
        <button type="button" class="btn-choice" id="payChoicePrimary">Betal nå</button>
        <button type="button" class="btn-choice" id="payChoicePartial">Annet beløp</button>
      </div>
      <div class="field hidden" id="partialField">
        <label for="payAmountInput">Skriv beløp (kr)</label>
        <input type="number" id="payAmountInput" min="1" step="1" inputmode="decimal">
      </div>
    </div>

    <div class="section-title">Betalingsmåte</div>
    <div class="field" id="phoneFieldWrap">
      <label for="phoneInput">Mobilnummer (kun for Vipps, 8 siffer)</label>
      <input type="tel" id="phoneInput" maxlength="8" inputmode="numeric" placeholder="91234567" autocomplete="tel-national">
      <div id="phoneFieldError" class="field-error hidden"></div>
    </div>
    <div class="pay-actions">
      <button type="button" class="btn-pay btn-vipps" id="paymentLinkVipps" disabled>
        <span class="mark">Vipps</span><span id="paymentLinkVippsLabel">Betal med Vipps</span>
      </button>
      <button type="button" class="btn-pay btn-card hidden" id="paymentLinkCard" disabled>Betal med bankkort</button>
    </div>
    <div class="note" id="payNote">Visa og Mastercard via Vipps.</div>

    <details class="account-toggle" id="accountDetails">
      <summary>Se hele saldoen til eleven</summary>
      <div class="account-grid">
        <div class="lbl">Totalt</div><div class="val" id="sumTotal">—</div>
        <div class="lbl">Betalt</div><div class="val" id="sumPaid">—</div>
        <div class="lbl">Gjenstår</div><div class="val" id="sumRest">—</div>
      </div>
    </details>
  </div>
  <div class="footer">Madina Skole · post@madinaskole.no</div>
</div>
<script>
const GET_INFO_URL = 'https://us-central1-madina-instituttet.cloudfunctions.net/getFakturaBetalingInfo';
const CREATE_PAY_URL = 'https://us-central1-madina-instituttet.cloudfunctions.net/createFakturaExternalPayment';
const FAKTURA_PAY_REF_KEY = 'fakturaPayRef';

const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
const vippsReturn = params.get('vipps') === 'return';
const returnRef = params.get('ref') || '';

let pageInfo = null;
let invoiceLocked = false;
let payAmountKr = 0;
let payMode = null;

function fmtKr(n) {
  return Number(n || 0).toLocaleString('no-NO') + ' kr';
}

function showMsg(text, kind) {
  const el = document.getElementById('statusMsg');
  el.textContent = text;
  el.className = 'msg ' + (kind || 'info');
  el.classList.remove('hidden');
}

function hideMsg() {
  document.getElementById('statusMsg').classList.add('hidden');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function updatePayButtons() {
  const ready = payAmountKr > 0;
  document.getElementById('paymentLinkVipps').disabled = !ready;
  document.getElementById('paymentLinkCard').disabled = !ready;
  document.getElementById('paymentLinkVippsLabel').textContent = ready
    ? ('Betal ' + fmtKr(payAmountKr) + ' med Vipps')
    : 'Velg beløp først';
}

function setPayAmount(kr) {
  payAmountKr = Math.round(Number(kr) || 0);
  document.getElementById('payAmountDisplay').textContent = fmtKr(payAmountKr);
  updatePayButtons();
}

function showPhoneError(text) {
  document.getElementById('phoneInput').classList.add('input-error');
  const err = document.getElementById('phoneFieldError');
  err.textContent = text;
  err.classList.remove('hidden');
}

function clearPhoneError() {
  document.getElementById('phoneInput').classList.remove('input-error');
  document.getElementById('phoneFieldError').classList.add('hidden');
}

function applyPageData(data) {
  pageInfo = data;
  invoiceLocked = !!(data.faktura && data.faktura.lockAmount);
  const f = data.faktura;

  document.getElementById('elevLine').textContent = data.elevNavn || 'Elev';
  document.getElementById('sumTotal').textContent = fmtKr(data.belopKr);
  document.getElementById('sumPaid').textContent = fmtKr(data.betaltKr);
  document.getElementById('sumRest').textContent = fmtKr(data.restKr);

  const hero = document.getElementById('heroBlock');
  const amountSection = document.getElementById('amountSection');
  const primaryBtn = document.getElementById('payChoicePrimary');
  const partialBtn = document.getElementById('payChoicePartial');

  if (f) {
    hero.classList.toggle('forfalt', f.status === 'forfalt');
    document.getElementById('refLine').textContent = f.dokumentRef || '';
    const meta = [];
    if (f.kategoriLabel) meta.push(f.kategoriLabel);
    if (f.betalingsfrist) meta.push('Frist ' + f.betalingsfrist);
    document.getElementById('metaLine').innerHTML = meta.map(escapeHtml).join(' · ');
    if (f.status === 'forfalt') {
      document.getElementById('metaLine').innerHTML += ' <span class="badge">Forfalt</span>';
    }
    amountSection.classList.toggle('hidden', invoiceLocked);
    document.getElementById('accountDetails').open = false;
    const invAmt = Math.min(Number(f.belopKr || 0), data.restKr);
    setPayAmount(invAmt);
  } else {
    hero.classList.remove('forfalt');
    document.getElementById('refLine').textContent = 'Utestående skolepenger';
    document.getElementById('metaLine').textContent = 'Velg beløp du vil betale nå';
    amountSection.classList.remove('hidden');
    partialBtn.classList.remove('hidden');
    primaryBtn.textContent = 'Betal alt (' + fmtKr(data.restKr) + ')';
    setPayAmount(0);
  }

  const cardBtn = document.getElementById('paymentLinkCard');
  const note = document.getElementById('payNote');
  if (data.cardAvailable) {
    cardBtn.classList.remove('hidden');
    note.textContent = 'Bankkort (Visa/Mastercard) via Vipps.';
  } else if (data.vippsEnv === 'test') {
    cardBtn.classList.add('hidden');
    note.textContent = 'Bankkort er kun tilgjengelig i produksjon — bruk Vipps i test.';
  } else {
    cardBtn.classList.add('hidden');
    note.textContent = 'Kun Vipps er tilgjengelig akkurat nå.';
  }
}

async function loadInfo() {
  if (vippsReturn && returnRef && token) {
    location.replace('betale-fullfort.html?t=' + encodeURIComponent(token) + '&ref=' + encodeURIComponent(returnRef));
    return;
  }
  if (!token) {
    showMsg('Mangler betalingslenke. Åpne lenken fra faktura-e-posten.', 'error');
    return;
  }
  showMsg('Laster…', 'info');
  try {
    const res = await fetch(GET_INFO_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    if (!data.ok) {
      showMsg(data.error || 'Kunne ikke laste betalingsinfo.', 'error');
      return;
    }
    if (data.restKr <= 0) {
      showMsg('Ingen utestående beløp — takk!', 'info');
      return;
    }
    hideMsg();
    document.getElementById('mainCard').classList.remove('hidden');
    applyPageData(data);
    if (!(data.faktura && data.faktura.lockAmount)) {
      document.getElementById('payChoicePrimary').click();
    }
  } catch (err) {
    console.error(err);
    showMsg('Nettverksfeil — prøv igjen.', 'error');
  }
}

function choosePrimary() {
  if (!pageInfo) return;
  payMode = 'primary';
  document.getElementById('payChoicePrimary').classList.add('selected');
  document.getElementById('payChoicePartial').classList.remove('selected');
  document.getElementById('partialField').classList.add('hidden');
  const amt = pageInfo.faktura
    ? Math.min(Number(pageInfo.faktura.belopKr || 0), pageInfo.restKr)
    : pageInfo.restKr;
  setPayAmount(amt);
}

function choosePartial() {
  payMode = 'partial';
  document.getElementById('payChoicePartial').classList.add('selected');
  document.getElementById('payChoicePrimary').classList.remove('selected');
  document.getElementById('partialField').classList.remove('hidden');
  const input = document.getElementById('payAmountInput');
  input.focus();
  const val = parseFloat(input.value);
  if (val > 0) setPayAmount(val);
  else setPayAmount(0);
}

async function payNow(paymentMethodType) {
  if (!pageInfo || payAmountKr <= 0) {
    showMsg('Velg beløp først.', 'error');
    return;
  }
  if (payAmountKr > pageInfo.restKr) {
    showMsg('Beløpet kan ikke overstige ' + fmtKr(pageInfo.restKr) + '.', 'error');
    return;
  }
  const phone = document.getElementById('phoneInput').value.replace(/\D/g, '').slice(-8);
  if (paymentMethodType === 'WALLET' && phone.length !== 8) {
    showPhoneError('Oppgi 8 siffer for Vipps.');
    return;
  }
  clearPhoneError();
  document.getElementById('paymentLinkVipps').disabled = true;
  document.getElementById('paymentLinkCard').disabled = true;
  showMsg('Sender deg til betaling…', 'info');
  try {
    const res = await fetch(CREATE_PAY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token,
        amountKr: payAmountKr,
        phoneNumber: phone,
        paymentMethodType,
      }),
    });
    const data = await res.json();
    if (!data.ok || !data.redirectUrl) {
      showMsg(data.error || 'Kunne ikke starte betaling.', 'error');
      updatePayButtons();
      return;
    }
    if (data.reference) sessionStorage.setItem(FAKTURA_PAY_REF_KEY, data.reference);
    location.href = data.redirectUrl;
  } catch (err) {
    console.error(err);
    showMsg('Nettverksfeil — prøv igjen.', 'error');
    updatePayButtons();
  }
}

document.getElementById('payChoicePrimary').addEventListener('click', choosePrimary);
document.getElementById('payChoicePartial').addEventListener('click', choosePartial);
document.getElementById('payAmountInput').addEventListener('input', () => {
  if (payMode !== 'partial') return;
  const val = parseFloat(document.getElementById('payAmountInput').value);
  setPayAmount(val > 0 ? val : 0);
});
document.getElementById('paymentLinkVipps').addEventListener('click', () => payNow('WALLET'));
document.getElementById('paymentLinkCard').addEventListener('click', () => payNow('CARD'));
document.getElementById('phoneInput').addEventListener('input', clearPhoneError);

loadInfo();
</script>
</body>
</html>
