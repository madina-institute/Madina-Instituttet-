<!DOCTYPE html>
<html lang="no" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madina Skole — Informasjon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#332f68; --indigo-deep:#211e42; --indigo-l:#4a4488;
    --coral:#e2643a; --gold:#b7924a; --gold-l:#d9bd7c;
    --paper:#EEF0FB; --ink:#17232e; --leaf:#4a7c59;
    --card:#fff; --line:rgba(51,47,104,.14);
    --sans:'Jost',sans-serif; --serif:'Cormorant Garamond',serif;
  }
  html[lang="ar"]{ --sans:'Noto Kufi Arabic',sans-serif; --serif:'Noto Kufi Arabic',sans-serif; }
  html[lang="ur"]{ --sans:'Noto Nastaliq Urdu',serif; --serif:'Noto Nastaliq Urdu',serif; }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.65;
    -webkit-text-size-adjust:100%;
  }
  html[lang="ur"] body{ line-height:2.1; }
  .wrap{ width:100%; max-width:960px; margin:0 auto; padding:0 18px; }

  /* ─── Topplinje ─── */
  .bar{
    position:sticky; top:0; z-index:60; background:var(--indigo-deep);
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  .bar-in{ display:flex; align-items:center; gap:12px; padding:10px 18px; max-width:960px; margin:0 auto; }
  .bar img{ height:30px; width:auto; border-radius:3px; }
  .langs{ display:flex; gap:4px; margin-inline-start:auto; }
  .langs button{
    font:inherit; font-size:13px; padding:6px 11px; border-radius:999px; cursor:pointer;
    background:transparent; color:#cfcbe8; border:1px solid rgba(255,255,255,.22);
  }
  .langs button[aria-pressed="true"]{ background:#fff; color:var(--indigo-deep); border-color:#fff; font-weight:600; }

  /* ─── Hero ─── */
  .hero{ background:var(--indigo); color:#fff; padding:38px 0 44px; text-align:center; }
  .hero .logo{ width:min(300px,72%); height:auto; margin-bottom:20px; }
  .pill{
    display:inline-block; background:rgba(255,255,255,.14); color:#f3e2d6;
    border:1px solid rgba(226,100,58,.5); border-radius:999px;
    padding:6px 16px; font-size:13px; letter-spacing:.05em; margin-bottom:16px;
  }
  .hero h1{ font-family:var(--serif); font-size:clamp(30px,7vw,46px); margin:0 0 12px; font-weight:700; }
  .hero p{ margin:0 auto; max-width:600px; color:#ddd9f0; font-size:15px; }
  .cta{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:26px; }
  .btn{
    font:inherit; font-weight:600; font-size:15px; text-decoration:none; cursor:pointer;
    padding:13px 26px; border-radius:999px; border:2px solid transparent; display:inline-block;
  }
  .btn-primary{ background:var(--coral); color:#fff; }
  .btn-ghost{ background:transparent; color:#fff; border-color:rgba(255,255,255,.45); }

  /* ─── Seksjoner ─── */
  section{ padding:44px 0; }
  section:nth-of-type(even){ background:#e4e7f7; }
  .eyebrow{ color:var(--coral); font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; margin:0 0 6px; }
  h2{ font-family:var(--serif); font-size:clamp(24px,5.5vw,34px); margin:0 0 22px; color:var(--indigo-deep); font-weight:700; }
  h3{ margin:0 0 6px; font-size:17px; color:var(--indigo-deep); }

  .grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .card{ background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--line); }
  .card .ico{ font-size:24px; display:block; margin-bottom:8px; }
  .card p{ margin:0; font-size:14.5px; color:#4a5560; }
  .card.accent{ border-inline-start:4px solid var(--coral); }
  .tag{ color:var(--coral); font-size:13px; font-weight:600; }

  /* ─── Timeplan ─── */
  .picker{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .picker button{
    font:inherit; font-size:14px; padding:9px 17px; border-radius:10px; cursor:pointer;
    background:#fff; color:var(--indigo); border:1px solid var(--line); font-weight:500;
  }
  .picker button[aria-pressed="true"]{ background:var(--indigo); color:#fff; border-color:var(--indigo); }
  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  th,td{ padding:11px 13px; text-align:start; font-size:14.5px; border-bottom:1px solid var(--line); }
  th{ background:var(--indigo); color:#fff; font-weight:600; font-size:13px; }
  tr:last-child td{ border-bottom:0; }
  td.time{ white-space:nowrap; color:#5b6672; font-variant-numeric:tabular-nums; }
  tr.brk td{ background:#f4f1e8; color:var(--gold); font-weight:600; text-align:center; }
  tr.sum td{ background:#eef4ef; color:var(--leaf); font-weight:600; }

  /* ─── Datoer ─── */
  .dates{ list-style:none; margin:0; padding:0; }
  .dates li{
    display:flex; flex-wrap:wrap; gap:4px 14px; align-items:baseline;
    background:#fff; border:1px solid var(--line); border-radius:11px;
    padding:13px 17px; margin-bottom:9px;
  }
  .dates .d{ font-weight:600; color:var(--indigo); min-width:170px; font-size:14.5px; }
  .dates .t{ font-size:14.5px; color:#4a5560; }
  .dates li.off .d{ color:var(--gold); }
  .note{ background:#fff; border:1px dashed var(--line); border-radius:11px; padding:15px 17px; font-size:14.5px; color:#4a5560; margin-top:6px; }

  /* ─── Pris ─── */
  .price{ font-family:var(--serif); font-size:38px; font-weight:700; color:var(--indigo); line-height:1.15; }
  html[lang="ur"] .price{ font-size:30px; }
  .card ul{ margin:12px 0 0; padding-inline-start:20px; font-size:14px; color:#4a5560; }
  .card ul li{ margin-bottom:4px; }

  /* ─── Steg ─── */
  ol.steps{ counter-reset:s; list-style:none; margin:0; padding:0; }
  ol.steps li{
    counter-increment:s; background:#fff; border:1px solid var(--line);
    border-radius:12px; padding:17px 19px; margin-bottom:11px; position:relative;
    padding-inline-start:60px;
  }
  ol.steps li::before{
    content:counter(s); position:absolute; inset-inline-start:17px; top:16px;
    width:28px; height:28px; border-radius:50%; background:var(--coral); color:#fff;
    display:grid; place-items:center; font-size:14px; font-weight:600; font-family:var(--sans);
  }

  /* ─── Bunn ─── */
  .final{ background:var(--indigo-deep); color:#fff; text-align:center; padding:46px 0; }
  .final h2{ color:#fff; }
  .final .qr{ width:120px; height:120px; border-radius:10px; background:#fff; padding:7px; margin:18px auto 0; display:block; }
  footer{ background:#1a1834; color:#9a95bd; text-align:center; padding:24px 0; font-size:13.5px; }
  footer a{ color:#c8c3e6; }

  @media (max-width:560px){
    .bar-in{ padding:9px 14px; gap:8px; }
    .langs button{ padding:5px 9px; font-size:12px; }
    section{ padding:34px 0; }
    th,td{ padding:9px 10px; font-size:13.5px; }
    .dates .d{ min-width:100%; }
  }
  @media print{
    .bar,.cta,.picker,.final .qr{ display:none !important; }
    body{ background:#fff; }
    section{ padding:14px 0; break-inside:avoid; }
    section:nth-of-type(even){ background:#fff; }
    .hero,.final{ background:#fff !important; color:#000 !important; }
    .hero h1,.final h2{ color:var(--indigo-deep) !important; }
    .hero p,.final p{ color:#333 !important; }
  }
</style>
</head>

      about:"ہم ایک محفوظ اور معاون تعلیمی ماحول پر یقین رکھتے ہیں جہاں ہر بچے سے شفقت کے ساتھ پیش آیا جائے، اور جہاں اساتذہ اور والدین کا قریبی تعاون مرکزی حیثیت رکھتا ہو۔ ادارہ اسلام کی ایسی تفہیم کو فروغ دیتا ہے جو محبت، رواداری اور تمام انسانوں کے احترام پر مبنی ہو — ایک عالمی نیٹ ورک کے حصے کے طور پر جس کی بنیاد شیخ محمد بن یحییٰ النینوی نے رکھی۔",
      finalH:"نشستیں محدود ہیں", finalP:"جگہ یقینی بنانے کے لیے جلد داخلہ لیں۔",
      brLunch:"کھانے کا وقفہ", brShort:"وقفہ", sumUp:"تمام طلبہ کا مشترکہ اجتماع",
      koranR:"قرآن — تلاوت", koranT:"قرآن — تجوید",
      islam1:"اسلامیات — حصہ 1", islam2:"اسلامیات — حصہ 2",
      lang1:"عربی/اردو — بول چال", lang2:"عربی/اردو — قواعد",
      cls:"کلاس"
    }
  };

  // Datoer: [nøkkel, fri?]
  var DATES = [
    ["5.9.2026",  false, {no:"Skolestart — oppstart høstsemesteret", ar:"بداية العام — انطلاق الفصل الأول", ur:"تعلیم کا آغاز — خزاں سمسٹر کی شروعات"}],
    ["3.10.2026", true,  {no:"Fri — høstferie", ar:"إجازة — عطلة الخريف", ur:"چھٹی — خزاں کی تعطیلات"}],
    ["19.12.2026",false, {no:"Siste skoledag i høstsemesteret", ar:"آخر يوم دراسي في الفصل الأول", ur:"خزاں سمسٹر کا آخری تعلیمی دن"}],
    ["26.12.2026",true,  {no:"Fri — juleferie", ar:"إجازة — عطلة الميلاد", ur:"چھٹی — کرسمس کی تعطیلات"}],
    ["2.1.2027",  true,  {no:"Fri — nyttårsferie", ar:"إجازة — عطلة رأس السنة", ur:"چھٹی — نئے سال کی تعطیل"}]
  ];

  // Rotasjon: A,D → 0 | B,E → 1 | C,F → 2
  var CLASSES = ["A","B","C","D","E","F"];
  var ROT = { A:0, D:0, B:1, E:1, C:2, F:2 };
  var BLOCKS = [
    [["koranR","koranT"],["islam1","islam2"],["lang1","lang2"]],
    [["islam1","islam2"],["lang1","lang2"],["koranR","koranT"]],
    [["lang1","lang2"],["koranR","koranT"],["islam1","islam2"]]
  ];
  var TIMES = [["09:30–10:00","10:00–10:30"],["10:50–11:20","11:20–11:50"],["11:55–12:25","12:25–12:55"]];

  var lang = "no", cls = "A";

  function t(k){ return (T[lang] && T[lang][k]) || T.no[k] || ""; }

  function renderPicker(){
    var p = document.getElementById("picker");
    p.innerHTML = "";
    CLASSES.forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = t("cls") + " " + c;
      b.setAttribute("aria-pressed", c === cls ? "true" : "false");
      b.onclick = function(){ cls = c; renderPicker(); renderPlan(); };
      p.appendChild(b);
    });
  }

  function row(time, text, klass){
    var tr = document.createElement("tr");
    if(klass) tr.className = klass;
    if(klass){
      var td = document.createElement("td");
      td.colSpan = 2; td.textContent = text + (time ? " · " + time : "");
      tr.appendChild(td);
    } else {
      var a = document.createElement("td"); a.className = "time"; a.textContent = time;
      var b = document.createElement("td"); b.textContent = text;
      tr.appendChild(a); tr.appendChild(b);
    }
    return tr;
  }

  function renderPlan(){
    var body = document.getElementById("planBody");
    body.innerHTML = "";
    var order = BLOCKS[ROT[cls]];
    for(var i = 0; i < 3; i++){
      body.appendChild(row(TIMES[i][0], t(order[i][0])));
      body.appendChild(row(TIMES[i][1], t(order[i][1])));
      if(i === 0) body.appendChild(row("10:30–10:50", t("brLunch"), "brk"));
      if(i === 1) body.appendChild(row("11:50–11:55", t("brShort"), "brk"));
      if(i === 2) body.appendChild(row("12:55–13:00", t("brShort"), "brk"));
    }
    body.appendChild(row("13:00–13:30", t("sumUp"), "sum"));
  }

  function renderDates(){
    var ul = document.getElementById("dateList");
    ul.innerHTML = "";
    DATES.forEach(function(d){
      var li = document.createElement("li");
      if(d[1]) li.className = "off";
      var s1 = document.createElement("span"); s1.className = "d"; s1.textContent = d[0];
      var s2 = document.createElement("span"); s2.className = "t"; s2.textContent = d[2][lang] || d[2].no;
      li.appendChild(s1); li.appendChild(s2);
      ul.appendChild(li);
    });
  }

  function apply(){
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === "no") ? "ltr" : "rtl";
    var nodes = document.querySelectorAll("[data-t]");
    for(var i = 0; i < nodes.length; i++){
      nodes[i].textContent = t(nodes[i].getAttribute("data-t"));
    }
    var b = document.querySelectorAll(".langs button");
    for(var j = 0; j < b.length; j++){
      b[j].setAttribute("aria-pressed", b[j].getAttribute("data-lang") === lang ? "true" : "false");
    }
    renderPicker(); renderPlan(); renderDates();
    try{ document.title = t("title") + " — " + t("hWhen"); }catch(e){}
  }

  var btns = document.querySelectorAll(".langs button");
  for(var k = 0; k < btns.length; k++){
    btns[k].addEventListener("click", function(){
      lang = this.getAttribute("data-lang");
      apply();
      window.scrollTo({ top:0, behavior:"smooth" });
    });
  }

  var bl=document.getElementById("barLogo"), hl=document.querySelector(".hero .logo");
  if(bl && hl) bl.src = hl.src;

  apply();
})();
</script>
</body>
</html>
