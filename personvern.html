  function listHtml(items){ return items.map(i => `<li>${i}</li>`).join(''); }

  function switchLang(lang){
    const t = TEXT[lang];
    const isRtl = (lang === 'ar' || lang === 'ur');
    document.getElementById('htmlRoot').setAttribute('lang', lang);
    document.getElementById('htmlRoot').setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    document.getElementById('btnLangNo').classList.toggle('active', lang === 'no');
    document.getElementById('btnLangAr').classList.toggle('active', lang === 'ar');
    document.getElementById('btnLangUr').classList.toggle('active', lang === 'ur');

    document.getElementById('pageTitle').textContent = t.pageTitle;
    document.getElementById('brandText').textContent = t.brand;
    document.getElementById('docTitle').textContent = t.docTitle;
    document.getElementById('docUpdated').textContent = t.docUpdated;
    document.getElementById('langNotice').textContent = t.langNotice;

    for(let n = 1; n <= 8; n++){
      document.getElementById('h'+n).textContent = t['h'+n];
      const pEl = document.getElementById('p'+n);
      if(pEl) pEl.textContent = t['p'+n];
      const lEl = document.getElementById('l'+n);
      if(lEl) lEl.innerHTML = listHtml(t['l'+n]);
    }

    document.getElementById('contactTitle').textContent = t.contactTitle;
    document.getElementById('contactEmailLbl').textContent = t.contactEmailLbl;
    document.getElementById('contactAddrLbl').textContent = t.contactAddrLbl;
    document.getElementById('contactOrgLbl').textContent = t.contactOrgLbl;
    document.getElementById('backLink').textContent = t.backLink;

    localStorage.setItem('madinaHomeLang', lang);
  }

  (function(){
    const saved = localStorage.getItem('madinaHomeLang');
    switchLang((saved === 'ar' || saved === 'ur') ? saved : 'no');
  })();
</script>
