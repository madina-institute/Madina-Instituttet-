<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madina Skole — Lærerinnsyn</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Lora:ital,wght@0,400;0,500;0,600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17232e; --emerald:#4A8FCB; --emerald-d:#2F6CA0; --emerald-l:#6FA8DC;
    --gold:#b7924a; --gold-l:#d9bd7c; --paper:#EEF0FB; --paper-2:#E4E7F7;
    --line:rgba(40,40,90,0.10); --shadow:0 10px 26px rgba(40,40,90,0.08); --red:#a83c3c;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Lora',serif; color:var(--ink); min-height:100vh;}

  #loginScreen{
    position:fixed; inset:0; z-index:9999; background:linear-gradient(165deg,var(--emerald) 0%, var(--emerald-d) 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:#fff; border-radius:10px; padding:40px 32px; max-width:360px; width:100%;
    box-shadow:0 20px 50px rgba(15,43,33,0.3); text-align:center;
  }
  .login-card h2{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px; color:var(--emerald-d); margin:0 0 4px;}
  .login-card .sub{font-family:'Jost',sans-serif; font-size:12px; color:#5a6860; margin-bottom:22px;}
  .login-card .field{margin-bottom:14px; text-align:start;}
  .login-card .field label{display:block; font-family:'Jost',sans-serif; font-size:11.5px; color:var(--emerald); margin-bottom:5px; font-weight:600;}
  .login-card .field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:6px; font-family:'Lora',serif; font-size:16px;
  }
  .btn-login{
    width:100%; margin-top:8px; background:var(--emerald); color:#fff; border:none; border-radius:6px;
    padding:13px 18px; font-family:'Jost',sans-serif; font-size:13px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.04em; cursor:pointer;
  }
  .login-error{margin-top:12px; font-family:'Jost',sans-serif; font-size:12.5px; color:var(--red); display:none;}

  header{ padding:26px 20px 14px; text-align:center; }
  header h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24px; margin:0 0 6px; color:var(--ink);}
  header p{font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:#8a8fa3; margin:0;}

  main{max-width:760px; margin:0 auto; padding:0 18px 60px;}

  .teacher-card{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; box-shadow:var(--shadow);
    margin-bottom:14px;
  }
  .teacher-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .teacher-name{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px; color:var(--emerald-d); flex:1 1 160px; min-width:0;}
  .teacher-meta{font-family:'Jost',sans-serif; font-size:11.5px; color:#8a9a90; margin-top:2px;}
  .fag-pill{
    display:inline-block; font-family:'Jost',sans-serif; font-size:10.5px; font-weight:600; color:var(--emerald-d);
    background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:3px 10px; white-space:nowrap;
  }
  .activity-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:480px){ .activity-grid{grid-template-columns:1fr;} }
  .activity-row{
    background:var(--paper); border-radius:8px; padding:10px 12px; font-family:'Jost',sans-serif;
  }
  .activity-row .lbl{font-size:10px; color:#8a9a90; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:3px;}
  .activity-row .val{font-size:12.5px; color:var(--ink); line-height:1.4;}
  .activity-row .val.empty{color:#b5bdc4; font-style:italic;}
  .empty-msg{
    font-family:'Jost',sans-serif; font-size:13px; color:#8a9a90; text-align:center; padding:40px 20px;
    background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h2>Lærerinnsyn</h2>
    <div class="sub">Samme innlogging som Administrativ-panelet</div>
    <div class="field">
      <label>E-post</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label>Passord</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Logg inn</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appRoot" style="display:none;">
  <header>
    <h1>Lærerinnsyn</h1>
    <p>Aktivitetsoversikt per lærer — kun for eier</p>
  </header>
  <main>
    <div id="teacherList"></div>
  </main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    initializeAppCheck, ReCaptchaV3Provider
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app-check.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAvOgrnCLlZnfBZgIm1fLb0KxlTdvkLlsM",
    authDomain: "madina-instituttet.firebaseapp.com",
    projectId: "madina-instituttet",
    storageBucket: "madina-instituttet.firebasestorage.app",
    messagingSenderId: "174564736838",
    appId: "1:174564736838:web:033f873c8b420d4bc96f47"
  };

  const app = initializeApp(firebaseConfig);
  const appCheck = initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider('6LfsK2wtAAAAAM9ZnHHDH_-4gVrCMNfibpBeHbt9'),
    isTokenAutoRefreshEnabled: true
  });
  const db = getFirestore(app);
  const auth = getAuth(app);

  // ── Datalyttere startes FØRST etter innlogging ──────────────────────
  // Firestore-reglene krever nå innlogging for lesing. En onSnapshot som
  // settes opp før innlogging blir permanent avvist (SDK-en prøver ikke
  // på nytt), og listen blir stående tom for alltid. watch() utsetter
  // derfor hver lytter til startDataListeners() kalles etter innlogging.
  let __listenersStarted = false;
  const __pendingWatchers = [];
  function watch(collectionName, onData, onError){
    const start = () => onSnapshot(
      collection(db, collectionName),
      onData,
      onError || ((err) => console.error(collectionName, err))
    );
    __pendingWatchers.push(start);
    if(__listenersStarted) start();
  }
  function startDataListeners(){
    if(__listenersStarted) return;
    __listenersStarted = true;
    __pendingWatchers.forEach(fn => fn());
  }

  window.doLogin = async function(){
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if(!email || !pw){
      errEl.textContent = 'Fyll ut e-post og passord.';
      errEl.style.display = 'block';
      return;
    }
    try{
      await signInWithEmailAndPassword(auth, email, pw);
    } catch(err){
      console.error(err);
      errEl.textContent = 'Feil e-post eller passord.';
      errEl.style.display = 'block';
    }
  };

  onAuthStateChanged(auth, (user) => {
    document.getElementById('loginScreen').style.display = user ? 'none' : 'flex';
    document.getElementById('appRoot').style.display = user ? 'block' : 'none';
    // Start datalytterne først når innloggingen er bekreftet — ellers blir
    // de avvist permanent av Firestore-reglene.
    if(user) startDataListeners();
  });

  function escapeHtml(str){
    const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML;
  }
  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleString('no-NO');
  }

  let teachers = [], classes = [], lessonPlans = [], homework = [], messageThreads = [], attendance = [], loginEvents = [];

  function resolveClassName(id){
    const c = classes.find(x => x.id === id);
    return c ? (c.navn || id) : id;
  }

  function render(){
    const el = document.getElementById('teacherList');
    if(teachers.length === 0){
      el.innerHTML = '<div class="empty-msg">Ingen lærere registrert ennå.</div>';
      return;
    }
    el.innerHTML = teachers.map(tc => {
      const myPlans = lessonPlans.filter(p => p.larer === tc.id).sort((a,b) => (b.dato||'').localeCompare(a.dato||''));
      const myHw = homework.filter(h => h.larer === tc.id).sort((a,b) => (b.dato||'').localeCompare(a.dato||''));
      const myThreads = messageThreads.filter(m => m.teacherId === tc.id).sort((a,b) => (b.lastActivityAt||b.createdAt||'').localeCompare(a.lastActivityAt||a.createdAt||''));
      const myAtt = attendance.filter(a => a.klasse === tc.tildeltKlasse).sort((a,b) => (b.dato||'').localeCompare(a.dato||''));
      const weekAgo = Date.now() - 7*24*60*60*1000;
      const myLogins = loginEvents.filter(le => le.role === 'teacher' && le.personId === tc.id && new Date(le.timestamp).getTime() >= weekAgo);

      const lastPlan = myPlans[0];
      const lastHw = myHw[0];
      const lastThread = myThreads[0];
      const lastAtt = myAtt[0];

      return `
        <div class="teacher-card">
          <div class="teacher-top">
            <div>
              <div class="teacher-name">${escapeHtml(tc.navn || '—')}</div>
              <div class="teacher-meta">${escapeHtml(resolveClassName(tc.tildeltKlasse))}</div>
            </div>
            <span class="fag-pill">${escapeHtml(tc.fag || '—')}</span>
          </div>
          <div class="activity-grid">
            <div class="activity-row">
              <div class="lbl">Siste innlogging</div>
              <div class="val ${tc.sisteInnlogging ? '' : 'empty'}">${tc.sisteInnlogging ? formatDate(tc.sisteInnlogging) : 'Aldri logget inn'}</div>
            </div>
            <div class="activity-row">
              <div class="lbl">Innlogginger siste 7 dager</div>
              <div class="val ${myLogins.length ? '' : 'empty'}">${myLogins.length}</div>
            </div>
            <div class="activity-row">
              <div class="lbl">Sist oppmøte registrert</div>
              <div class="val ${lastAtt ? '' : 'empty'}">${lastAtt ? escapeHtml(lastAtt.dato) : 'Ingen registrert ennå'}</div>
            </div>
            <div class="activity-row">
              <div class="lbl">Sist forberedelse</div>
              <div class="val ${lastPlan ? '' : 'empty'}">${lastPlan ? escapeHtml(lastPlan.dato) + ' — ' + escapeHtml(lastPlan.emne || '') : 'Ingen lagt ut ennå'}</div>
            </div>
            <div class="activity-row">
              <div class="lbl">Sist lekse</div>
              <div class="val ${lastHw ? '' : 'empty'}">${lastHw ? escapeHtml(lastHw.dato) + ' — ' + escapeHtml(lastHw.tittel || '') : 'Ingen lagt ut ennå'}</div>
            </div>
            <div class="activity-row">
              <div class="lbl">Sist meldingsaktivitet</div>
              <div class="val ${lastThread ? '' : 'empty'}">${lastThread ? formatDate(lastThread.lastActivityAt || lastThread.createdAt) + ' — ' + escapeHtml(lastThread.title || '') : 'Ingen samtaler ennå'}</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  watch('loginEvents', (snap) => {
    loginEvents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });

  watch('teachers', (snap) => {
    teachers = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (a.navn||'').localeCompare(b.navn||''));
    render();
  });
  watch('classes', (snap) => {
    classes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  watch('lessonPlans', (snap) => {
    lessonPlans = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  watch('homework', (snap) => {
    homework = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  watch('messageThreads', (snap) => {
    messageThreads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  watch('attendance', (snap) => {
    attendance = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
</script>
<style>
  #lastDeployBadge{
    /* iOS Safari's bottom toolbar overlaps position:fixed elements sitting
       right at the true bottom edge of the viewport, so this is lifted well
       clear of it (and of the home-indicator safe area on notched iPhones)
       instead of sitting flush at bottom:8px. */
    position:fixed; bottom:calc(64px + env(safe-area-inset-bottom, 0px)); inset-inline-end:10px; z-index:5000;
    font-family:'Jost',sans-serif,Arial,sans-serif; font-size:10.5px; color:#6a7870;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(3px);
    padding:4px 10px; border-radius:20px; border:1px solid rgba(0,0,0,0.08);
    pointer-events:none; letter-spacing:.01em; box-shadow:0 2px 8px rgba(0,0,0,0.12);
  }
  @media (max-width:480px){ #lastDeployBadge{ font-size:9.5px; padding:3px 8px; } }
</style>
<div id="lastDeployBadge">Sjekker siste publisering…</div>
<script>
  // Viser tidspunktet for siste VELLYKKEDE publisering av nettstedet.
  // Nettstedet ligger nå på Firebase Hosting (ikke GitHub Pages), og
  // publiseres av GitHub Action-en firebase-hosting.yml. Vi leser derfor
  // siste vellykkede kjøring av nettopp den workflow-en. Leser kun
  // offentlig, ikke-sensitiv informasjon (ingen token nødvendig).
  // MERK: publiserer du manuelt fra PC med `firebase deploy --only hosting`,
  // fanges det ikke opp her — da går publiseringen utenom GitHub.
  (function(){
    var el = document.getElementById('lastDeployBadge');
    if(!el) return;
    var GH_OWNER = 'madina-institute';
    var GH_REPO = 'Madina-Instituttet-';
    var API_BASE = 'https://api.github.com/repos/' + GH_OWNER + '/' + GH_REPO;

    function showError(msg){
      el.textContent = 'Siste publisering: kunne ikke sjekke (' + msg + ')';
      el.style.color = '#a5504a';
    }
    function showSuccess(iso){
      var d = new Date(iso);
      var datoStr = d.toLocaleDateString('no-NO') + ' kl. ' + d.toLocaleTimeString('no-NO', {hour:'2-digit', minute:'2-digit'});
      el.textContent = '✓ Siste publisering: ' + datoStr;
    }

    // Nettstedet publiseres nå via Firebase Hosting, ikke GitHub Pages.
    // Vi leser derfor siste VELLYKKEDE kjøring av GitHub Action-en som
    // utfører selve Firebase-publiseringen (firebase-hosting.yml).
    fetch(API_BASE + '/actions/workflows/firebase-hosting.yml/runs?status=success&per_page=1')
      .then(function(res){ if(!res.ok) throw new Error('HTTP ' + res.status + ' — workflow runs'); return res.json(); })
      .then(function(data){
        var runs = data && data.workflow_runs;
        if(!Array.isArray(runs) || runs.length === 0) throw new Error('ingen vellykket publisering funnet');
        showSuccess(runs[0].updated_at || runs[0].created_at);
      })
      .catch(function(err){
        console.error('Kunne ikke hente siste publisering:', err);
        showError(err && err.message ? err.message : 'nettverksfeil');
      });
  })();
</script>
</body>
</html>
