<!DOCTYPE html>
<!-- SIST-ENDRET: 2026-08-12 05:00:27 -->
<html lang="no" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Madina Skole</title>
<meta id="pageDesc" name="description" content="Madina Skole — koranundervisning, arabisk og urdu for barn, tilknyttet Madina Grorud moske, Oslo.">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Lora:ital,wght@0,400;0,500;0,600&family=Jost:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Instituttets offisielle palett, hentet fra Madina Institute sitt eget
     materiell. Blå er hovedfargen, men den står ikke alene: marineblå
     bærer flatene, oransje markerer det som skal handles på, og grønn
     brukes til bekreftelser. En side i kun én blåtone blir flat og
     vanskelig å navigere — kontrasten mellom fargene er det som gjør at
     øyet finner fram.

       #1A9BEC  blå        hovedfarge, lenker, ikoner
       #06195B  marine     bakgrunn, overskrifter
       #FF771F  oransje    handling: påmelding, viktige knapper
       #62C038  grønn      bekreftelse, positive punkter          */
  :root{
    --ink:#0d2033;
    --emerald:#1A9BEC; --emerald-d:#06195B; --emerald-l:#4fb3f2;
    --gold:#FF771F; --gold-l:#ff9a56;
    --coral:#FF771F; --coral-d:#e05f0d;
    --leaf:#62C038;
    --paper:#F0F7FE; --paper-2:#E1EFFB;
    --line:rgba(6,25,91,0.12); --shadow:0 10px 26px rgba(6,25,91,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Lora',serif; color:var(--ink); min-height:100vh; line-height:1.7;}
  html[dir="rtl"] body{font-family:'Tajawal','Lora',serif;}
  html[lang="ur"] body{line-height:2.1;}

  #inAppBrowserBanner{
    display:none; position:sticky; top:0; z-index:3000; background:var(--gold);
    color:#3a2e10; font-family:'Jost',sans-serif; font-size:12.5px; line-height:1.5; padding:12px 16px; text-align:center; box-shadow:var(--shadow);
  }
  html[dir="rtl"] #inAppBrowserBanner{font-family:'Tajawal',sans-serif;}
  #inAppBrowserBanner .close-banner{background:none; border:none; color:#3a2e10; font-weight:700; font-size:14px; cursor:pointer; margin-inline-start:10px; text-decoration:underline;}

  /* ===== شريط علوي ===== */
  nav.topbar{
    position:sticky; top:0; z-index:200; background:rgba(240,247,254,0.94); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:12px 20px;
  }
  /* 🔴 Toppbaren er sticky. Uten dette stanset hvert avsnitt AKKURAT
     under den, og overskriften — «Program», «Priser» — lå skjult bak
     baren. Man trykket på en lenke, siden hoppet, og man landet midt i
     en tekst uten å vite hvor man var.
     Verdien er baren pluss litt luft. Den settes i én variabel fordi
     baren har ulik høyde på telefon og skjerm, og to tall som skal være
     like ender alltid med å bli ulike. */
  /* Baren er nå en søyle — logo, to lenkerader, språkvalg — og da blir
     den høy: rundt 200 piksler, og verdien her er satt litt over
     så overskriften får luft under baren i stedet for å klistre seg til den. To tall som skal være like ender alltid
     med å bli ulike, så høyden står ett sted og brukes derfra.
     ⚠️ På telefon spiser en fast bar på 190 px omtrent en fjerdedel av
     skjermen hele tiden. Se notatet nederst i denne filen. */
  :root{ --topbar-h:236px; }
  section[id], header[id]{ scroll-margin-top:var(--topbar-h); }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion:reduce){ html{ scroll-behavior:auto; } }

  .topbar-inner{
    max-width:1080px; margin:0 auto; display:flex; flex-direction:column;
    align-items:center; gap:10px;
  }
  /* Logo og navn står øverst og midtstilt, som på et brevhode. Da er
     det første man ser hvem dette er — ikke en rad med lenker. */
  .brand{display:flex; align-items:center; justify-content:center; gap:10px;}
  .brand img{height:36px; width:auto; border-radius:8px;}
  .brand-text{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px; color:var(--emerald-d);}
  html[dir="rtl"] .brand-text{font-family:'Tajawal',sans-serif;}
  /* Lenkene i to rammer med skillelinjer mellom feltene, i stedet for
     frittstående ord som brøt over to linjer uten at det så tilsiktet ut. */
  .topbar-links{display:flex; flex-direction:column; gap:6px; width:100%; max-width:640px; min-width:0;}
  .nav-rad{
    display:flex; background:#fff; border:1px solid var(--line);
    border-radius:9px; overflow:hidden;
  }
  .topbar-links a{
    flex:1 1 0; min-width:0; text-align:center;
    color:var(--emerald-d); text-decoration:none;
    font-family:'Jost',sans-serif; font-size:11.5px; font-weight:600;
    padding:9px 4px; border-inline-end:1px solid #e6edf4;
    /* Ordene er ulike lange på de tre språkene. Uten dette ville et langt
       arabisk ord presset naboene sine sammen til de ikke var lesbare. */
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .nav-rad a:last-child{border-inline-end:0;}
  html[dir="rtl"] .topbar-links a{font-family:'Tajawal',sans-serif;}
  .topbar-links a:hover{background:var(--paper-2);}
  .topbar-links a:focus-visible{outline:2px solid var(--emerald); outline-offset:-2px;}
  /* På de smaleste skjermene er fire felt fortsatt trangt. Da faller
     skriften ned et hakk heller enn at ordene kuttes. */
  @media (max-width:400px){
    .topbar-links a{font-size:10.5px; padding:8px 2px;}
  }
  /* Språkvelgeren har samme form som fanene over: samme ramme, samme
     hjørner, samme skillelinjer. To ulike former rett over hverandre
     leses som to ulike systemer — det er én rad til, ikke noe annet. */
  .lang-switch-inner{
    display:flex; background:#fff; border:1px solid var(--line);
    border-radius:9px; overflow:hidden; width:100%; max-width:340px;
  }
  .lang-switch-inner button{
    flex:1 1 0; background:transparent; border:none; cursor:pointer;
    color:var(--emerald-d); font-family:'Jost',sans-serif;
    font-size:11.5px; font-weight:600; letter-spacing:0.02em;
    padding:9px 4px; border-inline-end:1px solid #e6edf4;
  }
  .lang-switch-inner button:last-child{border-inline-end:0;}
  .lang-switch-inner button:hover{background:var(--paper-2);}
  .lang-switch-inner button.active{background:var(--emerald-d); color:#fff;}
  .lang-switch-inner button:focus-visible{outline:2px solid var(--emerald); outline-offset:-2px;}

  /* ===== Hero (تصميم مطابق لهيكل SALAM، بألوان مدرسة مدينة) ===== */
  header.hero{
    background:
      radial-gradient(circle at 88% 12%, rgba(255,119,31,0.30) 0%, rgba(255,119,31,0) 50%),
      radial-gradient(circle at 8% 95%, rgba(26,155,236,0.45) 0%, rgba(26,155,236,0) 45%),
      linear-gradient(155deg, var(--emerald) 0%, var(--emerald-d) 100%);
    padding:56px 20px 46px; text-align:center; color:#fff;
  }
  .hero-inner{max-width:900px; margin:0 auto;}
  .hero-badge{
    display:inline-block; background:var(--leaf); border:1px solid rgba(255,255,255,0.2); color:#fff;
    font-family:'Jost',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; padding:6px 16px; border-radius:20px; margin-bottom:20px;
  }
  html[dir="rtl"] .hero-badge{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  header.hero h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:27px; margin:0 0 6px; color:#fff; line-height:1.4;}
  html[dir="rtl"] header.hero h1{font-family:'Tajawal',sans-serif; font-size:23px;}
  header.hero .school-year{font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:19px; color:#ffb98e; margin:0 0 18px;}
  html[dir="rtl"] header.hero .school-year{font-family:'Tajawal',sans-serif; font-style:normal;}
  header.hero p.lead{max-width:600px; margin:0 auto 26px; font-size:15px; color:rgba(255,255,255,0.88);}

  .quick-facts{
    display:flex; flex-direction:column; gap:0; justify-content:center; margin-bottom:28px; border-top:1px solid rgba(255,255,255,0.2);
    border-bottom:1px solid rgba(255,255,255,0.2);
  }
  .quick-fact{
    font-family:'Jost',sans-serif; font-size:12.5px; color:#fff; font-weight:500; padding:12px 0;
    border-top:1px solid rgba(255,255,255,0.15); text-align:center;
  }
  html[dir="rtl"] .quick-fact{font-family:'Tajawal',sans-serif;}
  .quick-fact:first-child{border-top:none;}
  .quick-fact b{display:block; font-weight:700; font-size:13.5px; margin-top:2px;}
  @media (min-width:560px){
    .quick-facts{ flex-direction:row; padding:16px 0; }
    .quick-fact{ padding:4px 20px; border-top:none; border-inline-start:1px solid rgba(255,255,255,0.25); flex:1 1 0; }
    .quick-fact:first-child{ border-inline-start:none; }
  }

  .hero-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .btn{
    display:inline-block; text-decoration:none; font-family:'Jost',sans-serif; font-weight:700; font-size:13.5px;
    padding:13px 26px; border-radius:8px;
  }
  html[dir="rtl"] .btn{font-family:'Tajawal',sans-serif;}
  .btn-primary{background:var(--coral); color:#fff; box-shadow:0 8px 20px rgba(255,119,31,0.35);}
  .btn-outline{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,0.6);}
  /* For buttons placed on the plain light page background (not the dark
     hero/tuition sections) — btn-outline's white-on-transparent style is
     unreadable there, so this uses a solid dark fill instead. */
  .btn-onlight{background:var(--emerald-d); color:#fff; box-shadow:0 8px 20px rgba(33,30,66,0.18);}
  .btn-onlight:hover{background:var(--emerald);}

  main{max-width:1080px; margin:0 auto; padding:0 20px 70px;}
  section{margin-top:56px;}
  .section-head{text-align:center; margin-bottom:28px;}
  .section-head .eyebrow{font-family:'Jost',sans-serif; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px;}
  html[dir="rtl"] .section-head .eyebrow{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .section-head h2{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24px; margin:0; color:var(--ink);}
  html[dir="rtl"] .section-head h2{font-family:'Tajawal',sans-serif; font-size:22px;}
  .section-head p{font-family:'Jost',sans-serif; color:#5a6b7d; font-size:13.5px; max-width:560px; margin:10px auto 0;}
  html[dir="rtl"] .section-head p{font-family:'Tajawal',sans-serif;}

  /* Steg (How to register) */
  .steps-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px;}
  .step-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:var(--shadow); position:relative;}
  .step-num{
    width:54px; height:54px; border-radius:50%; background:var(--paper-2); color:var(--emerald-d);
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;
  }
  .step-card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; margin:0 0 6px; color:var(--emerald-d);}
  html[dir="rtl"] .step-card h3{font-family:'Tajawal',sans-serif; font-size:15px;}
  .step-card p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6b7d; margin:0;}
  html[dir="rtl"] .step-card p{font-family:'Tajawal',sans-serif; font-size:13px;}

  /* Tuition box */
  .tuition-box{
    background:linear-gradient(135deg, var(--emerald) 0%, var(--emerald-d) 100%); border-radius:16px; padding:30px 26px;
    text-align:center; color:#fff; margin-top:20px; box-shadow:var(--shadow);
  }
  .tuition-box .tag{font-family:'Jost',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--coral); margin-bottom:6px;}
  html[dir="rtl"] .tuition-box .tag{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .tuition-box .amt{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:32px; margin-bottom:4px;}
  html[dir="rtl"] .tuition-box .amt{font-family:'Tajawal',sans-serif; font-size:26px;}
  .tuition-box .sub{font-family:'Jost',sans-serif; font-size:12.5px; opacity:0.9; margin-bottom:16px;}
  html[dir="rtl"] .tuition-box .sub{font-family:'Tajawal',sans-serif;}
  .tuition-box ul{list-style:none; padding:0; margin:0 0 18px; font-family:'Jost',sans-serif; font-size:12.5px; opacity:0.95;}
  html[dir="rtl"] .tuition-box ul{font-family:'Tajawal',sans-serif;}
  .tuition-box li{margin-bottom:5px;}
  .tuition-box .btn-primary{background:var(--coral); color:#fff;}

  /* Key dates timeline */
  .dates-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px;}
  .date-card{border-radius:12px; padding:20px 18px; box-shadow:var(--shadow); text-align:start;}
  .date-card.tone-1{background:#faf1e2;}
  .date-card.tone-2{background:#fce9e9;}
  .date-card.tone-3{background:#e9ecfa;}
  .date-card .when{
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px; color:var(--coral); margin-bottom:8px; display:block;
  }
  html[dir="rtl"] .date-card .when{font-family:'Tajawal',sans-serif; font-size:17px;}
  .date-card h3{display:none;}
  .date-card p{font-family:'Jost',sans-serif; font-size:13px; color:var(--ink); margin:0; font-weight:500;}
  html[dir="rtl"] .date-card p{font-family:'Tajawal',sans-serif; font-size:13.5px;}

  /* Program cards (3 subjects) */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:var(--shadow); text-align:center;}
  /* Kort MED bilde: bildet går helt ut i kanten, teksten får sin egen
     luft. Padding på kortet ville lagt en hvit ramme rundt fotoet og
     fått det til å se ut som et vedlegg i stedet for en del av kortet. */
  .card.med-bilde{padding:0; overflow:hidden; display:flex; flex-direction:column;}
  .card.med-bilde .kort-tekst{padding:18px 20px 22px;}
  .kort-bilde{
    display:block; width:100%; height:190px; object-fit:cover;
    /* Bordet og bøkene ligger i nedre halvdel av bildene. Uten dette
       ville beskjæringen tatt midten og vist mest bordplate. */
    object-position:center 42%;
    background:var(--paper-2);
  }
  @media (min-width:760px){ .kort-bilde{height:210px;} }
  .card .ic{font-size:30px; margin-bottom:10px;}
  .card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:17px; margin:0 0 8px; color:var(--emerald-d);}
  html[dir="rtl"] .card h3{font-family:'Tajawal',sans-serif; font-size:16px;}
  .card p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6b7d; margin:0; line-height:1.7;}
  html[dir="rtl"] .card p{font-family:'Tajawal',sans-serif; font-size:13px;}

  .sted-bilde{
    display:block; width:100%; height:auto; max-height:340px; object-fit:cover;
    object-position:center 62%;   /* døra og skiltet, ikke himmelen */
    border-radius:14px; border:1px solid var(--line);
    box-shadow:var(--shadow); margin-bottom:20px; background:var(--paper-2);
  }

  /* Mission/Vision/Philosophy */
  .mvp-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px;}
  .mvp-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px 22px; box-shadow:var(--shadow);}
  .mvp-card .eyebrow{font-family:'Jost',sans-serif; font-size:11px; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;}
  html[dir="rtl"] .mvp-card .eyebrow{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .mvp-card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px; margin:0 0 10px; color:var(--ink);}
  html[dir="rtl"] .mvp-card h3{font-family:'Tajawal',sans-serif; font-size:16px;}
  .mvp-card p{font-family:'Jost',sans-serif; font-size:13px; color:#5a6b7d; margin:0;}
  html[dir="rtl"] .mvp-card p{font-family:'Tajawal',sans-serif; font-size:13.5px;}

  /* Team */
  .team-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:16px;}
  .team-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px 16px; box-shadow:var(--shadow); text-align:center;}
  .team-avatar{
    width:56px; height:56px; border-radius:50%; background:var(--emerald); color:#fff; display:flex; align-items:center;
    justify-content:center; margin:0 auto 12px; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px;
  }
  .team-card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:15.5px; margin:0 0 4px; color:var(--ink);}
  html[dir="rtl"] .team-card h3{font-family:'Tajawal',sans-serif; font-size:14.5px;}
  .team-card .role{font-family:'Jost',sans-serif; font-size:11px; color:var(--emerald-d); font-weight:600;}
  html[dir="rtl"] .team-card .role{font-family:'Tajawal',sans-serif;}

  /* Portals */
  a.portal-card{
    display:block; background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px 18px;
    box-shadow:var(--shadow); text-align:center; text-decoration:none; color:inherit; transition:border-color .2s, transform .2s;
  }
  a.portal-card:hover{border-color:var(--gold); transform:translateY(-3px);}
  a.portal-card .ic{font-size:30px; margin-bottom:10px;}
  a.portal-card .title{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; color:var(--emerald-d); margin-bottom:5px;}
  html[dir="rtl"] a.portal-card .title{font-family:'Tajawal',sans-serif; font-size:15px;}
  a.portal-card .desc{font-family:'Jost',sans-serif; font-size:11px; color:#5a6b7d; line-height:1.5;}
  html[dir="rtl"] a.portal-card .desc{font-family:'Tajawal',sans-serif;}

  /* CTA final */
  .final-cta{
    background:linear-gradient(135deg, var(--emerald) 0%, var(--emerald-d) 100%); border-radius:16px; padding:40px 26px;
    text-align:center; box-shadow:var(--shadow);
  }
  .final-cta h2{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:23px; margin:0 0 10px; color:#fff;}
  html[dir="rtl"] .final-cta h2{font-family:'Tajawal',sans-serif; font-size:20px;}
  .final-cta p{font-family:'Jost',sans-serif; font-size:13px; color:rgba(255,255,255,0.9); margin:0 0 20px;}
  html[dir="rtl"] .final-cta p{font-family:'Tajawal',sans-serif;}
  .final-cta .btn-primary{background:#fff; color:var(--emerald-d); box-shadow:none;}

  footer{background:#fff; border-top:1px solid var(--line); margin-top:70px; padding:34px 20px; text-align:center;}
  footer .foot-inner{max-width:1080px; margin:0 auto;}
  footer h4{font-family:'Cormorant Garamond',serif; font-size:17px; margin:0 0 10px; color:var(--emerald-d);}
  html[dir="rtl"] footer h4{font-family:'Tajawal',sans-serif;}
  footer p{font-family:'Jost',sans-serif; font-size:12.5px; color:#8a978f; margin:4px 0;}
  html[dir="rtl"] footer p{font-family:'Tajawal',sans-serif;}
  footer a.plink{color:var(--emerald-d); text-decoration:none;}
  /* Prisseksjon. Beløpene er full pris — rabattsatsene er ikke fastsatt
     ennå, og derfor står de bevisst uten prosent her. Å love en sats vi
     ikke har vedtatt ville vært verre enn å si at den kommer. */
  .pris-kort{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:26px 24px; box-shadow:var(--shadow); text-align:center;
  }
  .pris-kort .pris-navn{
    font-family:'Jost',sans-serif; font-size:13px; font-weight:600;
    letter-spacing:.04em; color:var(--emerald-d); margin-bottom:4px;
  }
  .pris-kort .pris-dag{
    font-family:'Jost',sans-serif; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin-bottom:14px;
  }
  .pris-kort .pris-belop{
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:38px;
    color:var(--emerald); line-height:1.1;
  }
  .pris-kort .pris-per{
    font-family:'Jost',sans-serif; font-size:12px; color:#6b7480; margin-top:4px;
  }
  .pris-kort .pris-info{
    font-size:13.5px; color:#5a6b7d; margin-top:14px; padding-top:14px;

  const MUTAMMIM_VIDEO_URL = 'https://youtu.be/AwgsxvVi5Mw';
  // Bildene ligger på KORTET, ikke i språktabellene: motivet er det

  function bildeHtml(nokkel){
    const b = KORTBILDER[nokkel];
    if(!b) return '';
    const alt = (b.alt[currentLang] || b.alt.no).replace(/"/g, '&quot;');
    // <picture> gir webp der nettleseren støtter det og jpg ellers.
    // loading=lazy: bildene ligger langt nede på siden, og skal ikke
    // stjele båndbredde fra det familien leser først.
    return `<picture>
      <source srcset="${b.fil}.webp" type="image/webp">
      <img class="kort-bilde" src="${b.fil}${b.fil === 'koranstudier' ? '.jpeg' : '.jpg'}" alt="${alt}"
           loading="lazy" decoding="async" width="1200" height="800">
    </picture>`;
  }
  function cardsHtml(list){
    return list.map(c => `<div class="card${c.bilde ? ' med-bilde' : ''}">${
      c.bilde ? bildeHtml(c.bilde) : `<div class="ic">${c.ic}</div>`
    }<div class="kort-tekst"><h3>${c.h}</h3><p>${c.p}</p>${c.video ? `<p style="margin-top:10px;"><a href="${MUTAMMIM_VIDEO_URL}" target="_blank" rel="noopener" style="color:var(--emerald-d); text-decoration:none; font-weight:700;">${c.video}</a></p>` : ''}</div></div>`).join('');
  }
  function stepsHtml(list){ return list.map((s,i) => `<div class="step-card"><div class="step-num">${i+1}</div><h3>${s.h}</h3><p>${s.p}</p></div>`).join(''); }
  function datesHtml(list){ return list.map((d,i) => `<div class="date-card tone-${(i%3)+1}"><span class="when">${d.h}</span><h3>${d.h}</h3><p>${d.p}</p></div>`).join(''); }
  function mvpHtml(list){ return list.map(m => `<div class="mvp-card"><div class="eyebrow">${m.eyebrow}</div><h3>${m.h}</h3><p>${m.p}</p></div>`).join(''); }
  function teamHtml(list){
    return list.map(t => {
      const initials = t.n.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
      return `<div class="team-card"><div class="team-avatar">${initials}</div><h3>${t.n}</h3><div class="role">${t.r}</div></div>`;
    }).join('');
  }
  function portalsHtml(list){ return list.map(p => `<a class="portal-card" href="${p.href}"><div class="ic">${p.ic}</div><div class="title">${p.h}</div><div class="desc">${p.p}</div></a>`).join(''); }
  function quickFactsHtml(list){ return list.map(f => `<span class="quick-fact">${f.l}<b>${f.v}</b></span>`).join(''); }
  // To rader à fire felt, ikke åtte i én.
  //
  // Åtte felt på en telefonskjerm gir under 45 piksler hver — smalere enn
  // ordene som skal stå der. Og de arabiske og urdu-ordene er lengre enn
  // de norske, så en bredde som så vidt holder på norsk, kutter teksten
  // på de to andre språkene.
  //
  // Rekkefølgen er ikke tilfeldig: øverste rad er det en familie som ikke
  // kjenner skolen leter etter — meld på, når, hvilke timer, hva slags
  // program. Nederste rad er det man ser på etterpå.
  function navHtml(t){
    const rad = (lenker) => '<div class="nav-rad">' +
      lenker.map(([href, tekst]) => `<a href="${href}">${tekst}</a>`).join('') + '</div>';
    return rad([
      ['#register', t.nav.register],
      ['#dates',    t.nav.dates],
      ['/timeplan', t.nav.timeplan],
      ['#program',  t.nav.program]
    ]) + rad([
      ['#priser',   t.nav.priser],
      ['#who',      t.nav.who],
      ['#team',     t.nav.team],
      ['#portals',  t.nav.portals]
    ]);
  }

      advarselTittel: '⚠️ آپ صرف ایک جگہ رکن ہو سکتے ہیں',
      advarsel: 'ناروے کا قانون فی رکن امداد دیتا ہے، اور کوئی بھی بیک وقت دو مذہبی جماعتوں میں شمار نہیں ہو سکتا۔ اگر آپ کہیں اور رکن ہیں تو یہاں رجسٹر ہونے کے بعد جلد از جلد وہاں سے رکنیت ختم کریں۔',

  function tegnMedlemskort(t){

  function switchLang(lang){
    // Språket huskes, slik at priser og medlemskort kan tegnes på nytt
    // når de ekte tallene kommer inn — uten å måtte gjette språket.

    document.getElementById('heroTitle').textContent = t.heroTitle;
    document.getElementById('heroYear').textContent = t.heroYear;
    document.getElementById('heroLead').textContent = t.heroLead;
    document.getElementById('quickFacts').innerHTML = quickFactsHtml(t.quickFacts);
    document.getElementById('heroBtnPrimary').textContent = t.heroBtnPrimary;
    document.getElementById('heroBtnOutline').textContent = t.heroBtnOutline;

    document.getElementById('regEyebrow').textContent = t.regEyebrow;

      <a class="btn btn-primary" href="/påmelding">${t.tuitionBtn}</a>`;

    document.getElementById('datesEyebrow').textContent = t.datesEyebrow;
    document.getElementById('datesTitle').textContent = t.datesTitle;
    document.getElementById('datesDesc').textContent = t.datesDesc;
    document.getElementById('datesTimeplanBtn').textContent = t.datesTimeplanBtn;
    document.getElementById('datesRow').innerHTML = datesHtml(t.dates);

    document.getElementById('programEyebrow').textContent = t.programEyebrow;
    document.getElementById('programTitle').textContent = t.programTitle;
    document.getElementById('programDesc').textContent = t.programDesc;
    document.getElementById('programCards').innerHTML = cardsHtml(t.programCards);
    // Alt-teksten på bygget følger språket. En skjermleser på arabisk
    // skal ikke lese en norsk setning.
    const sted = document.getElementById('stedBilde');
    if(sted) sted.alt = ({
      no:'Inngangen til Madina Institute og Senter Oslo i Hagelundveien 2b',
      ar:'مدخل معهد ومركز مدينة أوسلو في هاغلوندفايين 2b',
      ur:'ہیگلنڈوائن 2b میں مدینہ انسٹی ٹیوٹ اور سینٹر اوسلو کا داخلی دروازہ'
    })[currentLang] || 'Madina Institute og Senter Oslo';

    document.getElementById('prisEyebrow').textContent = t.prisEyebrow;
    document.getElementById('prisTitle').textContent = t.prisTitle;
    document.getElementById('prisDesc').textContent = t.prisDesc;
    // Beløpene kommer fra basen, ikke fra teksten over. Sto de skrevet
    // inn her, ville de blitt stående mens de ekte prisene endret seg —
    // og det gjorde de: siden viste 2 750 og 1 500 mens skolen tok 5 500
    // og 3 000. En familie som bestemte seg ut fra denne siden, møtte et
    // annet tall i skjemaet.
    document.getElementById('prisCards').innerHTML = (t.prisKort || []).map(k => {
      const pris = levendePris(k.kode);
      return `
      <div class="pris-kort">
        <div class="pris-navn">${k.navn}</div>
        <div class="pris-dag">${k.dag}</div>
        <div class="pris-belop">${pris.belop}</div>
        <div class="pris-per">${pris.per}</div>
        <div class="pris-info">${k.info}</div>
      </div>`;
    }).join('');
    document.getElementById('prisNoter').innerHTML =
      levendeNoter(t).map(x => `<div class="pris-note">${x}</div>`).join('');
    tegnMedlemskort(t);
    document.getElementById('whoEyebrow').textContent = t.whoEyebrow;
    document.getElementById('whoTitle').textContent = t.whoTitle;
    document.getElementById('whoDesc').textContent = t.whoDesc;
    document.getElementById('mvpRow').innerHTML = mvpHtml(t.mvp);

    document.getElementById('teamEyebrow').textContent = t.teamEyebrow;

    localStorage.setItem('madinaHomeLang', lang);
  }

  (function(){
    const saved = localStorage.getItem('madinaHomeLang');
    switchLang((saved === 'ar' || saved === 'ur') ? saved : 'no');

</script>

<!-- ══ TIDSSTEMPEL (kun for utvikling) ═══════════════════════════════
     Denne siden er det første foresatte ser. Et lite merke med dato og
     klokkeslett i hjørnet ville sett ut som en glemt detalj fra et
     nettsted under arbeid — derfor vises det bare når man selv legger
     til «?dev» i adressen. Besøkende ser ingenting.

     Tidspunktet leses fra linjen «SIST-ENDRET» som publiseringsverktøyet
     skriver øverst i filen ved hver publisering. Er den ikke der, er
     filen publisert utenom verktøyet — og merket sier nettopp det.
     ════════════════════════════════════════════════════════════════ -->

<script type="module">
  // ═══════════════════════════════════════════════════════════════════
  // LEVENDE PRISER PÅ FORSIDEN
  //
  // 🔴 Beløpene sto skrevet inn i teksten: 2 750 og 1 500. De ekte
  // prisene er 5 500 og 3 000 — satt i panelet under Skole → Programmer.
  // Forsiden viste altså under halve prisen, på tre språk, til alle som
  // kom innom.
  //
  // Samme feil som i foreldreportalen (2 750/1 500 der også) og i
  // påmeldingsskjemaet før 9. august: prisen fantes flere steder, og de
  // stedene gled fra hverandre.
  //
  // Kildene her er de samme som panelet og Vipps regner med:
  // 'programs' og 'settings/priser'. Begge er offentlig lesbare —
  // skjemaet viser dem uansett til familier som ikke er logget inn.
  //
  // 🔴 Feiler lesingen, vises INGEN pris — ikke et gammelt tall. Et
  // foreldet beløp på skolens forside er et løfte skolen ikke kan holde.
  // ═══════════════════════════════════════════════════════════════════
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, getDoc }
    from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const app = initializeApp({
    apiKey: "AIzaSyAvOgrnCLlZnfBZgIm1fLb0KxlTdvkLlsM",
    authDomain: "madina-instituttet.firebaseapp.com",
    projectId: "madina-instituttet",
    storageBucket: "madina-instituttet.firebasestorage.app",
    messagingSenderId: "174564736838",
    appId: "1:174564736838:web:033f873c8b420d4bc96f47"
  });
  const db = getFirestore(app);

  const PROGRAM_NAVN = {
    hoved: 'Madina Islamske Skole — Integrert program (Lørdag)',
    barn:  'Madinabarn (Søndag)'
  };

  window.__priser = null;

  const kr = v => Math.round(v).toLocaleString('no-NO');

  // Kalles fra tegnefunksjonen. Er prisene ikke lest ennå, sier den det
  // — i stedet for å vise et tall som kanskje ikke stemmer.
  window.levendePris = function(kode){
    const P = window.__priser;
    const tekst = (window.__sprak === 'ar')
      ? { henter: 'جارٍ التحميل…', ukjent: 'يُحدَّد عند القبول', per: 'سنويًا', medlem: 'للأعضاء' }
      : (window.__sprak === 'ur')
      ? { henter: 'لوڈ ہو رہا ہے…', ukjent: 'داخلے پر بتائی جائے گی', per: 'سالانہ', medlem: 'اراکین کے لیے' }
      : { henter: 'Henter…', ukjent: 'Oppgis ved opptak', per: 'per år', medlem: 'for medlemmer' };
    if(!P) return { belop: tekst.henter, per: '' };
    const p = P.programmer[PROGRAM_NAVN[kode]];
    if(!p || (!p.aar && !p.mnd)) return { belop: tekst.ukjent, per: '' };
    const medlemAar = p.mnd * p.maneder;
    // Begge prisene vises. Familien skal se hva medlemskapet er verdt,
    // ikke bare ett tall uten sammenligning.
    return {
      belop: kr(p.aar) + ' kr',
      per: tekst.per + (medlemAar > 0 && medlemAar < p.aar
        ? ' · ' + kr(medlemAar) + ' kr ' + tekst.medlem : '')
    };
  };

  // Notene sa «satsene er ikke fastsatt ennå» — men de ER fastsatt, og
  // materiellavgiften er ulik per program. Nå skrives de fra basen.
  window.levendeNoter = function(t){
    const P = window.__priser;
    const orig = (t.prisNoter || []).filter(x =>
      !/Rabatter|التخفيضات|رعایتیں|Bøker|الكتب|کتابیں|Depositum|العربون|ڈپازٹ/.test(x));
    if(!P) return orig;
    const ar = window.__sprak === 'ar', ur = window.__sprak === 'ur';
    const ut = [];

    if(P.rabatt2 || P.rabatt3){
      ut.push(ar
        ? `<b>التخفيضات:</b> خصم الإخوة ${P.rabatt2}% للطفل الثاني و${P.rabatt3}% للثالث فما بعده. سعر العضو والخصم لا يُجمعان.`
        : ur
        ? `<b>رعایتیں:</b> دوسرے بچے کے لیے ${P.rabatt2}% اور تیسرے سے ${P.rabatt3}%۔`
        : `<b>Rabatter:</b> Søskenrabatt ${P.rabatt2} % for barn nummer to og ${P.rabatt3} % fra og med det tredje. Medlemspris og søskenrabatt kombineres ikke.`);
    }

    // Materiellavgiften kan være ulik per program — Madinabarn og det
    // integrerte programmet bruker ikke de samme bøkene.
    const mats = Object.entries(PROGRAM_NAVN).map(([k, navn]) => {
      const p = P.programmer[navn];
      const m = (p && p.materiell !== null && p.materiell !== undefined) ? p.materiell : P.materiell;
      return { navn, m };
    }).filter(x => x.m > 0);
    const like = mats.length && mats.every(x => x.m === mats[0].m);
    if(mats.length){
      ut.push(ar
        ? (like ? `<b>الكتب:</b> المواد الدراسية إضافية وتكلفتها ${kr(mats[0].m)} كرونة سنويًا.`
                : `<b>الكتب:</b> ` + mats.map(x => `${x.navn}: ${kr(x.m)} كرونة`).join(' · '))
        : ur
        ? `<b>کتابیں:</b> ${kr(mats[0].m)} کرونر سالانہ۔`
        : (like ? `<b>Bøker:</b> Skolemateriell kommer i tillegg og koster ${kr(mats[0].m)} kr per år.`
                : `<b>Bøker:</b> ` + mats.map(x => `${x.navn}: ${kr(x.m)} kr`).join(' · ')));
    }

    if(P.depositum > 0){
      ut.push(ar
        ? `<b>العربون:</b> عند قبول الطالب يُدفع ${kr(P.depositum)} كرونة خلال ${P.depositumFrist || 5} أيام، ويُخصم من المبلغ الإجمالي.`
        : ur
        ? `<b>ڈپازٹ:</b> ${kr(P.depositum)} کرونر، ${P.depositumFrist || 5} دن کے اندر۔`
        : `<b>Depositum:</b> Ved tilbud om plass betales ${kr(P.depositum)} kr innen ${P.depositumFrist || 5} dager. Beløpet trekkes fra totalen.`);
    }
    return [...ut, ...orig];
  };

  async function lastPriser(){
    try{
      const snap = await getDocs(collection(db, 'programs'));
      const programmer = {};
      const tall = v => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
      snap.forEach(d => {
        const p = d.data();
        if(!p.navn || p.aktiv === 'Nei') return;
        const eget = String(p.materiellAvgift === undefined || p.materiellAvgift === null ? '' : p.materiellAvgift).trim();
        programmer[p.navn] = {
          aar: tall(p.prisAar),
          mnd: tall(p.prisMedlemMnd),
          maneder: tall(p.antallManeder) || 9,
          materiell: eget !== '' ? tall(eget) : null
        };
      });
      let d = {};
      try{
        const sn = await getDoc(doc(db, 'settings', 'priser'));
        if(sn.exists()) d = sn.data() || {};
      } catch(e){ /* rabattene er en bonus i visningen, ikke et krav */ }
      window.__priser = {
        programmer,
        rabatt2: tall(d.soskenRabatt2), rabatt3: tall(d.soskenRabatt3),
        materiell: tall(d.materiellAvgift),
        depositum: tall(d.depositum), depositumFrist: tall(d.depositumFrist)
      };
    } catch(err){
      console.error('Kunne ikke hente priser', err);
      window.__priser = null;   // ingen pris er bedre enn feil pris
    }
    // Tegn på nytt med de ekte tallene.
    if(typeof window.__tegnAlt === 'function') window.__tegnAlt();
  }
  lastPriser();
</script>

<script>
  (function(){
    if(!/(\?|&)dev(\b|=)/.test(location.search)) return;
    var el = document.getElementById('devEditBadge');
    if(!el) return;
    el.style.display = 'block';
    fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var m = txt.match(/SIST-ENDRET:\s*([\d]{4}-[\d]{2}-[\d]{2} [\d]{2}:[\d]{2}:[\d]{2})/);
        if(!m){ el.textContent = '✏️ Ingen tidsstempel — publisert utenom verktøyet'; return; }
        var d = new Date(m[1].replace(' ', 'T'));
        el.textContent = '✏️ Sist endret: ' +
          d.toLocaleDateString('no-NO') + ' kl. ' +
          d.toLocaleTimeString('no-NO', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      })
      .catch(function(){ el.textContent = '✏️ Kunne ikke lese tidsstempel'; });
  })();
</script>
