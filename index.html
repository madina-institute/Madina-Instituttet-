<header class="hero">

  <h1 id="heroTitle"></h1>

  </div>

    </div>
    <div class="steps-row" id="stepsRow"></div>
    <div class="tuition-box" id="tuitionBox"></div>
  </section>

  <section id="dates">
    <div class="section-head">

      <p id="datesDesc"></p>
    </div>
    <div class="dates-row" id="datesRow"></div>
    <div style="text-align:center; margin-top:22px;">
      <a class="btn btn-onlight" href="/timeplan" id="datesTimeplanBtn"></a>
    </div>
  </section>

  <section id="program">
    <div class="section-head">
      <div class="eyebrow" id="programEyebrow"></div>

  <section id="priser">

      <div class="eyebrow" id="prisEyebrow"></div>
      <h2 id="prisTitle"></h2>
      <p id="prisDesc"></p>
    </div>
    <div class="card-grid" id="prisCards"></div>
    <div class="pris-noter" id="prisNoter"></div>

    <div id="medlemsKort"></div>
  </section>

    <div class="section-head">
      <div class="eyebrow" id="whoEyebrow"></div>

      <p id="whoDesc"></p>
    </div>

         viser HVOR. En familie som skal komme lørdag morgen kjenner igjen
         døra fra dette bildet — det er hele jobben det gjør. -->
    <picture>
      <source srcset="moske.webp" type="image/webp">
      <img class="sted-bilde" src="moske.jpg" id="stedBilde"

  <section id="team">

  <section id="portals">
