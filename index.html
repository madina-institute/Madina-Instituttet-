<!DOCTYPE html>
<!-- SIST-ENDRET: 2026-08-12 05:06:02 -->
<html lang="no"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Bildene</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#16283a;--emerald:#2f7cc9;--emerald-d:#1c5490;--paper-2:#eef4fa;
--line:rgba(22,40,58,.16);--shadow:0 16px 36px rgba(28,84,144,.14);}
*{box-sizing:border-box}body{margin:0;background:#e8edf3;font-family:'Jost',sans-serif;padding:18px}
.w{max-width:440px;margin:0 auto;display:grid;gap:16px}
h1{font-family:'Cormorant Garamond',serif;color:#1c5490;font-size:21px;margin:0 0 4px}
.lab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#1c5490;margin-top:8px}
.card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:var(--shadow); text-align:center;}
.card.med-bilde{padding:0; overflow:hidden; display:flex; flex-direction:column;}
.card.med-bilde .kort-tekst{padding:18px 20px 22px;}
.kort-bilde{
    display:block; width:100%; height:190px; object-fit:cover;
    /* Bordet og bøkene ligger i nedre halvdel av bildene. Uten dette
       ville beskjæringen tatt midten og vist mest bordplate. */
    object-position:center 42%;
    background:var(--paper-2);
  }
@media (min-width:760px){ .kort-bilde{height:210px;} }
.card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:17px; margin:0 0 8px; color:var(--emerald-d);}
.card p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6b7d; margin:0; line-height:1.7;}
.sted-bilde{
    display:block; width:100%; height:auto; max-height:340px; object-fit:cover;
    object-position:center 62%;   /* døra og skiltet, ikke himmelen */
    border-radius:14px; border:1px solid var(--line);
    box-shadow:var(--shadow); margin-bottom:20px; background:var(--paper-2);
  }</style></head><body><div class="w">
<h1>Bildene i kortene</h1>
<div class="card med-bilde">
<picture><source srcset="bilder/koranstudier.webp" type="image/webp">
<img class="kort-bilde" src="bilder/koranstudier.jpg" alt="Koranstudier" loading="lazy"></picture>
<div class="kort-tekst"><h3>Koranstudier</h3><p>Koranlesing, memorering og tajwīd-regler.</p></div></div><div class="card med-bilde">
<picture><source srcset="bilder/arabisk.webp" type="image/webp">
<img class="kort-bilde" src="bilder/arabisk.jpg" alt="Arabisk og urdu" loading="lazy"></picture>
<div class="kort-tekst"><h3>Arabisk og urdu</h3><p>Strukturert opplæring i lesing, skriving og muntlig kommunikasjon.</p></div></div><div class="card med-bilde">
<picture><source srcset="bilder/skriving.webp" type="image/webp">
<img class="kort-bilde" src="bilder/skriving.jpg" alt="Skriveøving" loading="lazy"></picture>
<div class="kort-tekst"><h3>Skriveøving</h3><p>Barna øver bokstavene for hånd, uke for uke.</p></div></div>
<div class="lab">Om oss — bygget</div>
<picture><source srcset="bilder/moske.webp" type="image/webp">
<img class="sted-bilde" src="bilder/moske.jpg" alt="Inngangen"></picture>
</div></body></html>
