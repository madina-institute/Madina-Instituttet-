<!DOCTYPE html>
<html lang="no" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Madina Skole</title>
<meta id="pageDesc" name="description" content="Madina Skole — koranundervisning, arabisk og urdu for barn, tilknyttet Madina Grorud moske, Oslo.">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Lora:ital,wght@0,400;0,500;0,600&family=Jost:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17232e; --emerald:#4A8FCB; --emerald-d:#2F6CA0; --emerald-l:#6FA8DC;
    --gold:#b7924a; --gold-l:#d9bd7c; --paper:#EEF0FB; --paper-2:#E4E7F7;
    --line:rgba(40,40,90,0.10); --shadow:0 10px 26px rgba(40,40,90,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Lora',serif; color:var(--ink); min-height:100vh; line-height:1.7;}
  html[dir="rtl"] body{font-family:'Tajawal','Lora',serif;}

  #inAppBrowserBanner{
    display:none; position:sticky; top:0; z-index:3000; background:var(--gold);
    color:#3a2e10; font-family:'Jost',sans-serif; font-size:12.5px; line-height:1.5; padding:12px 16px; text-align:center; box-shadow:var(--shadow);
  }
  html[dir="rtl"] #inAppBrowserBanner{font-family:'Tajawal',sans-serif;}
  #inAppBrowserBanner strong{font-weight:700;}
  #inAppBrowserBanner .close-banner{background:none; border:none; color:#3a2e10; font-weight:700; font-size:14px; cursor:pointer; margin-inline-start:10px; text-decoration:underline;}

  .corner-deco{
    position:fixed; bottom:-10%; width:38vw; max-width:420px; height:70vh; max-height:520px;
    z-index:-1; pointer-events:none; opacity:0.5;
    background:linear-gradient(135deg, #C9BFF0 0%, #A38FE0 100%);
  }
  .corner-deco-left{ left:-10%; clip-path:polygon(0 0, 0 100%, 100% 100%); }
  .corner-deco-right{ right:-10%; clip-path:polygon(100% 0, 0 100%, 100% 100%); }
  html[dir="rtl"] .corner-deco-left{ left:auto; right:-10%; clip-path:polygon(100% 0, 100% 100%, 0 100%); }
  html[dir="rtl"] .corner-deco-right{ right:auto; left:-10%; clip-path:polygon(0 0, 100% 100%, 0 100%); }
  @media (max-width:640px){ .corner-deco{ display:none; } }

  /* ===== شريط علوي / topbar ===== */
  nav.topbar{
    position:sticky; top:0; z-index:200; background:rgba(238,240,251,0.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:12px 20px;
  }
  .topbar-inner{max-width:1080px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{height:38px; width:auto; border-radius:8px;}
  .brand-text{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px; color:var(--emerald-d);}
  html[dir="rtl"] .brand-text{font-family:'Tajawal',sans-serif;}
  .topbar-links{display:flex; gap:18px; flex-wrap:wrap; align-items:center;}
  .topbar-links a{color:var(--ink); text-decoration:none; font-family:'Jost',sans-serif; font-size:12.5px; font-weight:600; opacity:0.75; letter-spacing:0.02em;}
  html[dir="rtl"] .topbar-links a{font-family:'Tajawal',sans-serif;}
  .topbar-links a:hover{opacity:1; color:var(--emerald-d);}

  .lang-switch-inner{ display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; }
  .lang-switch-inner button{
    background:transparent; border:none; color:var(--ink); opacity:0.55; font-family:'Jost',sans-serif;
    font-size:11px; font-weight:600; letter-spacing:0.04em; padding:7px 14px; cursor:pointer;
  }
  .lang-switch-inner button.active{background:var(--emerald); color:#fff; opacity:1;}

  /* ===== Hero ===== */
  header.hero{ max-width:1080px; margin:0 auto; padding:56px 20px 40px; text-align:center; }
  header.hero .eyebrow{font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:10px;}
  html[dir="rtl"] header.hero .eyebrow{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  header.hero h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:23px; margin:0 0 14px; color:var(--ink); line-height:1.5;}
  html[dir="rtl"] header.hero h1{font-family:'Tajawal',sans-serif; font-size:22px;}
  header.hero p.lead{max-width:620px; margin:0 auto 16px; font-size:15px; color:#4a5860;}
  header.hero p.motto{font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold); font-size:15px; margin:0 0 26px;}
  html[dir="rtl"] header.hero p.motto{font-family:'Tajawal',sans-serif; font-style:normal;}
  html[lang="ur"] header.hero p.motto{font-family:'Noto Nastaliq Urdu','Tajawal',serif;}
  .hero-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .btn{
    display:inline-block; text-decoration:none; font-family:'Jost',sans-serif; font-weight:700; font-size:13.5px;
    padding:13px 26px; border-radius:8px; transition:transform .15s;
  }
  html[dir="rtl"] .btn{font-family:'Tajawal',sans-serif;}
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--emerald); color:#fff; box-shadow:0 8px 20px rgba(74,143,203,0.35);}
  .btn-outline{background:#fff; color:var(--emerald-d); border:1.5px solid var(--emerald);}

  main{max-width:1080px; margin:0 auto; padding:0 20px 70px;}
  section{margin-top:56px;}
  .section-head{text-align:center; margin-bottom:30px;}
  .section-head .eyebrow{font-family:'Jost',sans-serif; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px;}
  html[dir="rtl"] .section-head .eyebrow{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .section-head h2{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:25px; margin:0; color:var(--ink);}
  html[dir="rtl"] .section-head h2{font-family:'Tajawal',sans-serif; font-size:23px;}
  .section-head p{font-family:'Jost',sans-serif; color:#5a6860; font-size:13.5px; max-width:560px; margin:10px auto 0;}
  html[dir="rtl"] .section-head p{font-family:'Tajawal',sans-serif;}

  .card-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:16px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:var(--shadow);}
  .card .ic{font-size:26px; margin-bottom:10px;}
  .card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:17px; margin:0 0 8px; color:var(--emerald-d);}
  html[dir="rtl"] .card h3{font-family:'Tajawal',sans-serif; font-size:16px;}
  .card p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6860; margin:0; line-height:1.7;}
  html[dir="rtl"] .card p{font-family:'Tajawal',sans-serif; font-size:13px;}

  a.portal-card{
    display:block; background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px 18px;
    box-shadow:var(--shadow); text-align:center; text-decoration:none; color:inherit; transition:border-color .2s, transform .2s;
  }
  a.portal-card:hover{border-color:var(--gold); transform:translateY(-3px);}
  a.portal-card .ic{font-size:30px; margin-bottom:10px;}
  a.portal-card .title{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; color:var(--emerald-d); margin-bottom:5px;}
  html[dir="rtl"] a.portal-card .title{font-family:'Tajawal',sans-serif; font-size:15px;}
  a.portal-card .desc{font-family:'Jost',sans-serif; font-size:11px; color:#5a6860; line-height:1.5;}
  html[dir="rtl"] a.portal-card .desc{font-family:'Tajawal',sans-serif;}

  .org-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-bottom:14px;}
  .org-box{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 20px; box-shadow:var(--shadow);
    text-align:center; min-width:150px; flex:1 1 150px; max-width:230px;
  }
  .org-box .lbl{font-family:'Jost',sans-serif; font-size:10px; letter-spacing:0.03em; color:#8a9a90; text-transform:uppercase; margin-bottom:5px;}
  html[dir="rtl"] .org-box .lbl{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .org-box .val{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:15px; color:var(--ink);}
  html[dir="rtl"] .org-box .val{font-family:'Tajawal',sans-serif; font-size:14px;}
  .org-connector{text-align:center; color:#c3c8e0; font-size:18px; margin:2px 0;}

  .draft-note{
    background:var(--paper-2); border:1px dashed var(--gold); border-radius:10px; padding:14px 18px;
    font-family:'Jost',sans-serif; font-size:12px; color:#6b5a30; margin-top:18px; line-height:1.7;
  }
  html[dir="rtl"] .draft-note{font-family:'Tajawal',sans-serif; font-size:12.5px;}
  .draft-note strong{color:#8a6d20;}

  .program-list{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:16px;}
  .program-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow);}
  .program-card .tag{
    display:inline-block; font-family:'Jost',sans-serif; font-size:10px; font-weight:700; color:var(--emerald-d);
    background:var(--paper-2); border-radius:10px; padding:3px 10px; margin-bottom:10px;
  }
  html[dir="rtl"] .program-card .tag{font-family:'Tajawal',sans-serif;}
  .program-card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; margin:0 0 6px; color:var(--ink);}
  html[dir="rtl"] .program-card h3{font-family:'Tajawal',sans-serif; font-size:15px;}
  .program-card p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6860; margin:0;}
  html[dir="rtl"] .program-card p{font-family:'Tajawal',sans-serif; font-size:13px;}

  footer{background:#fff; border-top:1px solid var(--line); margin-top:70px; padding:34px 20px; text-align:center;}
  footer .foot-inner{max-width:1080px; margin:0 auto;}
  footer h4{font-family:'Cormorant Garamond',serif; font-size:17px; margin:0 0 10px; color:var(--emerald-d);}
  html[dir="rtl"] footer h4{font-family:'Tajawal',sans-serif;}
  footer p{font-family:'Jost',sans-serif; font-size:12.5px; color:#8a978f; margin:4px 0;}
  html[dir="rtl"] footer p{font-family:'Tajawal',sans-serif;}
  footer .placeholder{color:#b5952a; font-style:italic;}

  /* ===== الأوردو: خط Nastaliq + تباعد أسطر أكبر يناسب طبيعة الخط ===== */
  html[lang="ur"] body, html[lang="ur"] .brand-text, html[lang="ur"] .topbar-links a,
  html[lang="ur"] header.hero .eyebrow, html[lang="ur"] header.hero h1, html[lang="ur"] .btn,
  html[lang="ur"] .section-head .eyebrow, html[lang="ur"] .section-head h2, html[lang="ur"] .section-head p,
  html[lang="ur"] .card h3, html[lang="ur"] .card p, html[lang="ur"] a.portal-card .title, html[lang="ur"] a.portal-card .desc,
  html[lang="ur"] .org-box .lbl, html[lang="ur"] .org-box .val, html[lang="ur"] .draft-note,
  html[lang="ur"] .program-card .tag, html[lang="ur"] .program-card h3, html[lang="ur"] .program-card p,
  html[lang="ur"] footer h4, html[lang="ur"] footer p, html[lang="ur"] #inAppBrowserBanner{
    font-family:'Noto Nastaliq Urdu','Tajawal',serif;
  }
  html[lang="ur"] body{ line-height:2.3; }
  html[lang="ur"] header.hero h1{ line-height:2.1; font-size:21px; }
  html[lang="ur"] .card p, html[lang="ur"] .program-card p, html[lang="ur"] .section-head p, html[lang="ur"] .draft-note{ line-height:2.2; }
</style>
</head>
<body>

<div id="inAppBrowserBanner">
  <span id="bannerText"></span>
  <button class="close-banner" id="bannerClose" onclick="document.getElementById('inAppBrowserBanner').style.display='none'"></button>
</div>
<script>
  (function(){
    var ua = navigator.userAgent || '';
    var isInApp = /FBAN|FBAV|Instagram|WhatsApp|Line\/|Twitter|LinkedInApp|Snapchat/i.test(ua);
    if(isInApp){ document.getElementById('inAppBrowserBanner').style.display = 'block'; }
  })();
</script>

<div class="corner-deco corner-deco-left"></div>
<div class="corner-deco corner-deco-right"></div>

<nav class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="https://madina.no/images/logo.png" alt="Madina Skole">
      <span class="brand-text" id="brandText">Madina Skole</span>
    </div>
    <div class="topbar-links" id="topbarLinks"></div>
    <a href="https://madina.no" target="_blank" rel="noopener" id="instituteLink" style="font-size:11.5px; font-weight:700; color:var(--gold); text-decoration:none; white-space:nowrap;"></a>
    <div class="lang-switch-inner">
      <button id="btnLangNo" class="active" onclick="switchLang('no')">Norsk</button>
      <button id="btnLangAr" onclick="switchLang('ar')">العربية</button>
      <button id="btnLangUr" onclick="switchLang('ur')">اردو</button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="eyebrow" id="heroEyebrow"></div>
  <h1 id="heroTitle"></h1>
  <p class="lead" id="heroLead"></p>
  <p class="motto" id="heroMotto"></p>
  <div class="hero-actions">
    <a class="btn btn-primary" href="index2.html" id="heroBtnPrimary"></a>
    <a class="btn btn-outline" href="#portals" id="heroBtnOutline"></a>
  </div>
</header>

<main>
  <section id="about">
    <div class="section-head">
      <div class="eyebrow" id="aboutEyebrow"></div>
      <h2 id="aboutTitle"></h2>
    </div>
    <div class="card-grid" id="aboutCards"></div>
  </section>

  <section id="vision">
    <div class="section-head">
      <div class="eyebrow" id="visionEyebrow"></div>
      <h2 id="visionTitle"></h2>
      <p id="visionDesc"></p>
    </div>
    <div class="card-grid" id="visionCards"></div>
  </section>

  <section id="schedule">
    <div class="section-head">
      <div class="eyebrow" id="scheduleEyebrow"></div>
      <h2 id="scheduleTitle"></h2>
      <p id="scheduleDesc"></p>
    </div>
    <div class="card-grid" id="scheduleCards"></div>
    <div class="draft-note" id="priceNote"></div>
  </section>

  <section id="programs">
    <div class="section-head">
      <div class="eyebrow" id="programsEyebrow"></div>
      <h2 id="programsTitle"></h2>
      <p id="programsDesc"></p>
    </div>
    <div class="program-list" id="programCards"></div>
  </section>

  <section id="admin">
    <div class="section-head">
      <div class="eyebrow" id="adminEyebrow"></div>
      <h2 id="adminTitle"></h2>
      <p id="adminDesc"></p>
    </div>
    <div id="orgChart"></div>
    <div class="draft-note" id="adminDraftNote"></div>
  </section>

  <section id="portals">
    <div class="section-head">
      <div class="eyebrow" id="portalsEyebrow"></div>
      <h2 id="portalsTitle"></h2>
      <p id="portalsDesc"></p>
    </div>
    <div class="card-grid" id="portalCards"></div>
  </section>
</main>

<footer>
  <div class="foot-inner">
    <h4 id="footerBrand"></h4>
    <p id="footerAddr"></p>
    <p id="footerContact"></p>
    <p id="footerOrgNr" style="font-size:11px;"></p>
    <p id="footerCopy"></p>
  </div>
</footer>

  function cardsHtml(list){
    return list.map(c => `<div class="card"><div class="ic">${c.ic}</div><h3>${c.h}</h3><p>${c.p}</p></div>`).join('');
  }
  function programsHtml(list){
    return list.map(c => `<div class="program-card"><span class="tag">${c.tag}</span><h3>${c.h}</h3><p>${c.p}</p></div>`).join('');
  }
  function orgHtml(list){
    // Nivå 1 alene øverst, nivå 2 (to bokser) i midten, nivå 3 + foresatte nederst
    const l1 = list.filter(o => o.lbl === list[0].lbl);
    return `
      <div class="org-row"><div class="org-box"><div class="lbl">${list[0].lbl}</div><div class="val">${list[0].val}</div></div></div>
      <div class="org-connector">↓</div>
      <div class="org-row">
        <div class="org-box"><div class="lbl">${list[1].lbl}</div><div class="val">${list[1].val}</div></div>
        <div class="org-box"><div class="lbl">${list[2].lbl}</div><div class="val">${list[2].val}</div></div>
      </div>
      <div class="org-connector">↓</div>
      <div class="org-row">
        <div class="org-box"><div class="lbl">${list[3].lbl}</div><div class="val">${list[3].val}</div></div>
        <div class="org-box"><div class="lbl">${list[4].lbl}</div><div class="val">${list[4].val}</div></div>
      </div>`;
  }
  function portalsHtml(list){
    return list.map(p => `<a class="portal-card" href="${p.href}"><div class="ic">${p.ic}</div><div class="title">${p.h}</div><div class="desc">${p.p}</div></a>`).join('');
  }
  function navHtml(t){
    return `<a href="#about">${t.nav.about}</a><a href="#vision">${t.nav.vision}</a><a href="#schedule">${t.nav.schedule}</a><a href="#programs">${t.nav.programs}</a><a href="#admin">${t.nav.admin}</a><a href="#portals">${t.nav.portals}</a><a href="index2.html">${t.nav.reg}</a>`;
  }

  function switchLang(lang){
    const t = TEXT[lang];
    const isRtl = (lang === 'ar' || lang === 'ur');
    document.getElementById('htmlRoot').setAttribute('lang', lang);
    document.getElementById('htmlRoot').setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    document.getElementById('btnLangNo').classList.toggle('active', lang === 'no');
    document.getElementById('btnLangAr').classList.toggle('active', lang === 'ar');
    document.getElementById('btnLangUr').classList.toggle('active', lang === 'ur');

    document.getElementById('pageTitle').textContent = t.pageTitle;
    document.getElementById('pageDesc').setAttribute('content', t.pageDesc);
    document.getElementById('bannerText').textContent = t.bannerText;
    document.getElementById('bannerClose').textContent = t.bannerClose;
    document.getElementById('brandText').textContent = t.brand;
    document.getElementById('topbarLinks').innerHTML = navHtml(t);
    document.getElementById('instituteLink').textContent = t.instituteLink;

    document.getElementById('heroEyebrow').textContent = t.heroEyebrow;
    document.getElementById('heroTitle').textContent = t.heroTitle;
    document.getElementById('heroLead').textContent = t.heroLead;
    document.getElementById('heroMotto').textContent = t.heroMotto;
    document.getElementById('heroBtnPrimary').textContent = t.heroBtnPrimary;
    document.getElementById('heroBtnOutline').textContent = t.heroBtnOutline;

    document.getElementById('aboutEyebrow').textContent = t.aboutEyebrow;
    document.getElementById('aboutTitle').textContent = t.aboutTitle;
    document.getElementById('aboutCards').innerHTML = cardsHtml(t.aboutCards);

    document.getElementById('visionEyebrow').textContent = t.visionEyebrow;
    document.getElementById('visionTitle').textContent = t.visionTitle;
    document.getElementById('visionDesc').textContent = t.visionDesc;
    document.getElementById('visionCards').innerHTML = cardsHtml(t.visionCards);

    document.getElementById('scheduleEyebrow').textContent = t.scheduleEyebrow;
    document.getElementById('scheduleTitle').textContent = t.scheduleTitle;
    document.getElementById('scheduleDesc').textContent = t.scheduleDesc;
    document.getElementById('scheduleCards').innerHTML = cardsHtml(t.scheduleCards);
    document.getElementById('priceNote').textContent = t.priceNote;

    document.getElementById('programsEyebrow').textContent = t.programsEyebrow;
    document.getElementById('programsTitle').textContent = t.programsTitle;
    document.getElementById('programsDesc').textContent = t.programsDesc;
    document.getElementById('programCards').innerHTML = programsHtml(t.programs);

    document.getElementById('adminEyebrow').textContent = t.adminEyebrow;
    document.getElementById('adminTitle').textContent = t.adminTitle;
    document.getElementById('adminDesc').textContent = t.adminDesc;
    document.getElementById('orgChart').innerHTML = orgHtml(t.org);
    document.getElementById('adminDraftNote').innerHTML = '<strong>!</strong> ' + t.adminDraftNote;

    document.getElementById('portalsEyebrow').textContent = t.portalsEyebrow;
    document.getElementById('portalsTitle').textContent = t.portalsTitle;
    document.getElementById('portalsDesc').textContent = t.portalsDesc;
    document.getElementById('portalCards').innerHTML = portalsHtml(t.portals);

    document.getElementById('footerBrand').textContent = t.footerBrand;
    document.getElementById('footerAddr').textContent = t.footerAddr;
    document.getElementById('footerContact').textContent = t.footerContact;
    document.getElementById('footerOrgNr').textContent = t.footerOrgNr;
    document.getElementById('footerCopy').textContent = t.footerCopy;

    localStorage.setItem('madinaHomeLang', lang);
  }

  (function(){
    const saved = localStorage.getItem('madinaHomeLang');
    switchLang((saved === 'ar' || saved === 'ur') ? saved : 'no'); // النرويجية هي اللغة الافتراضية دائمًا عند أول زيارة
  })();
</script>
