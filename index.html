<!DOCTYPE html>
<html lang="no" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Madina Skole</title>
<meta id="pageDesc" name="description" content="Madina Skole — koranundervisning, arabisk og urdu for barn, tilknyttet Madina Grorud moske, Oslo.">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=Lora:ital,wght@0,400;0,500;0,600&family=Jost:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17232e; --emerald:#332f68; --emerald-d:#211e42; --emerald-l:#4a4488;
    --gold:#b7924a; --gold-l:#d9bd7c; --coral:#e2643a; --coral-d:#c94f28; --leaf:#4a7c59;
    --paper:#EEF0FB; --paper-2:#E4E7F7; --line:rgba(40,40,90,0.10); --shadow:0 10px 26px rgba(40,40,90,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); font-family:'Lora',serif; color:var(--ink); min-height:100vh; line-height:1.7;}
  html[dir="rtl"] body{font-family:'Tajawal','Lora',serif;}
  html[lang="ur"] body{line-height:2.1;}

  #inAppBrowserBanner{
    display:none; position:sticky; top:0; z-index:3000; background:var(--gold);
    color:#3a2e10; font-family:'Jost',sans-serif; font-size:12.5px; line-height:1.5; padding:12px 16px; text-align:center; box-shadow:var(--shadow);
  }
  html[dir="rtl"] #inAppBrowserBanner{font-family:'Tajawal',sans-serif;}
  #inAppBrowserBanner .close-banner{background:none; border:none; color:#3a2e10; font-weight:700; font-size:14px; cursor:pointer; margin-inline-start:10px; text-decoration:underline;}

  /* ===== شريط علوي ===== */
  nav.topbar{
    position:sticky; top:0; z-index:200; background:rgba(238,240,251,0.94); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:12px 20px;
  }
  .topbar-inner{max-width:1080px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand img{height:36px; width:auto; border-radius:8px;}
  .brand-text{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px; color:var(--emerald-d);}
  html[dir="rtl"] .brand-text{font-family:'Tajawal',sans-serif;}
  .topbar-links{display:flex; gap:16px; flex-wrap:wrap; align-items:center;}
  .topbar-links a{color:var(--ink); text-decoration:none; font-family:'Jost',sans-serif; font-size:12px; font-weight:600; opacity:0.75;}
  html[dir="rtl"] .topbar-links a{font-family:'Tajawal',sans-serif;}
  .topbar-links a:hover{opacity:1; color:var(--emerald-d);}
  .lang-switch-inner{ display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; }
  .lang-switch-inner button{
    background:transparent; border:none; color:var(--ink); opacity:0.55; font-family:'Jost',sans-serif;
    font-size:10.5px; font-weight:600; letter-spacing:0.04em; padding:6px 12px; cursor:pointer;
  }
  .lang-switch-inner button.active{background:var(--emerald); color:#fff; opacity:1;}

  /* ===== Hero (تصميم مطابق لهيكل SALAM، بألوان مدرسة مدينة) ===== */
  header.hero{
    background:
      radial-gradient(circle at 88% 12%, rgba(226,100,58,0.28) 0%, rgba(226,100,58,0) 50%),
      radial-gradient(circle at 8% 95%, rgba(74,68,136,0.5) 0%, rgba(74,68,136,0) 45%),
      linear-gradient(155deg, var(--emerald) 0%, var(--emerald-d) 100%);
    padding:56px 20px 46px; text-align:center; color:#fff;
  }
  .hero-inner{max-width:900px; margin:0 auto;}
  .hero-badge{
    display:inline-block; background:var(--leaf); border:1px solid rgba(255,255,255,0.2); color:#fff;
    font-family:'Jost',sans-serif; font-size:11px; font-weight:700;
    letter-spacing:0.04em; text-transform:uppercase; padding:6px 16px; border-radius:20px; margin-bottom:20px;
  }
  html[dir="rtl"] .hero-badge{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  header.hero h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:27px; margin:0 0 6px; color:#fff; line-height:1.4;}
  html[dir="rtl"] header.hero h1{font-family:'Tajawal',sans-serif; font-size:23px;}
  header.hero .school-year{font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:19px; color:#f0a687; margin:0 0 18px;}
  html[dir="rtl"] header.hero .school-year{font-family:'Tajawal',sans-serif; font-style:normal;}
  header.hero p.lead{max-width:600px; margin:0 auto 26px; font-size:15px; color:rgba(255,255,255,0.88);}

  .quick-facts{
    display:flex; flex-direction:column; gap:0; justify-content:center; margin-bottom:28px; border-top:1px solid rgba(255,255,255,0.2);
    border-bottom:1px solid rgba(255,255,255,0.2);
  }
  .quick-fact{
    font-family:'Jost',sans-serif; font-size:12.5px; color:#fff; font-weight:500; padding:12px 0;
    border-top:1px solid rgba(255,255,255,0.15); text-align:center;
  }
  html[dir="rtl"] .quick-fact{font-family:'Tajawal',sans-serif;}
  .quick-fact:first-child{border-top:none;}
  .quick-fact b{display:block; font-weight:700; font-size:13.5px; margin-top:2px;}
  @media (min-width:560px){
    .quick-facts{ flex-direction:row; padding:16px 0; }
    .quick-fact{ padding:4px 20px; border-top:none; border-inline-start:1px solid rgba(255,255,255,0.25); flex:1 1 0; }
    .quick-fact:first-child{ border-inline-start:none; }
  }

  .hero-actions{display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  .btn{
    display:inline-block; text-decoration:none; font-family:'Jost',sans-serif; font-weight:700; font-size:13.5px;
    padding:13px 26px; border-radius:8px;
  }
  html[dir="rtl"] .btn{font-family:'Tajawal',sans-serif;}
  .btn-primary{background:#fff; color:var(--emerald-d); box-shadow:0 8px 20px rgba(0,0,0,0.15);}
  .btn-outline{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,0.6);}

  main{max-width:1080px; margin:0 auto; padding:0 20px 70px;}
  section{margin-top:56px;}
  .section-head{text-align:center; margin-bottom:28px;}
  .section-head .eyebrow{font-family:'Jost',sans-serif; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:8px;}
  html[dir="rtl"] .section-head .eyebrow{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .section-head h2{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24px; margin:0; color:var(--ink);}
  html[dir="rtl"] .section-head h2{font-family:'Tajawal',sans-serif; font-size:22px;}
  .section-head p{font-family:'Jost',sans-serif; color:#5a6860; font-size:13.5px; max-width:560px; margin:10px auto 0;}
  html[dir="rtl"] .section-head p{font-family:'Tajawal',sans-serif;}

  /* Steg (How to register) */
  .steps-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px;}
  .step-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:var(--shadow); position:relative;}
  .step-num{
    width:54px; height:54px; border-radius:50%; background:#f5ddc4; color:var(--emerald-d);
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;
  }
  .step-card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; margin:0 0 6px; color:var(--emerald-d);}
  html[dir="rtl"] .step-card h3{font-family:'Tajawal',sans-serif; font-size:15px;}
  .step-card p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6860; margin:0;}
  html[dir="rtl"] .step-card p{font-family:'Tajawal',sans-serif; font-size:13px;}

  /* Tuition box */
  .tuition-box{
    background:linear-gradient(135deg, var(--emerald) 0%, var(--emerald-d) 100%); border-radius:16px; padding:30px 26px;
    text-align:center; color:#fff; margin-top:20px; box-shadow:var(--shadow);
  }
  .tuition-box .tag{font-family:'Jost',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--coral); margin-bottom:6px;}
  html[dir="rtl"] .tuition-box .tag{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .tuition-box .amt{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:32px; margin-bottom:4px;}
  html[dir="rtl"] .tuition-box .amt{font-family:'Tajawal',sans-serif; font-size:26px;}
  .tuition-box .sub{font-family:'Jost',sans-serif; font-size:12.5px; opacity:0.9; margin-bottom:16px;}
  html[dir="rtl"] .tuition-box .sub{font-family:'Tajawal',sans-serif;}
  .tuition-box ul{list-style:none; padding:0; margin:0 0 18px; font-family:'Jost',sans-serif; font-size:12.5px; opacity:0.95;}
  html[dir="rtl"] .tuition-box ul{font-family:'Tajawal',sans-serif;}
  .tuition-box li{margin-bottom:5px;}
  .tuition-box .btn-primary{background:var(--coral); color:#fff;}

  /* Key dates timeline */
  .calendar-link-card{
    display:inline-flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:24px 30px; box-shadow:var(--shadow); text-decoration:none; color:inherit; max-width:480px; transition:transform .2s, border-color .2s;
  }
  .calendar-link-card:hover{transform:translateY(-3px); border-color:var(--coral);}
  .calendar-link-card .ic{font-size:34px; flex:0 0 auto;}
  .calendar-link-card .txt{text-align:start;}
  .calendar-link-card .txt h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:17px; margin:0 0 4px; color:var(--emerald-d);}
  html[dir="rtl"] .calendar-link-card .txt h3{font-family:'Tajawal',sans-serif; font-size:16px;}
  .calendar-link-card .txt p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6860; margin:0;}
  html[dir="rtl"] .calendar-link-card .txt p{font-family:'Tajawal',sans-serif;}
  .calendar-link-card .arrow{font-size:20px; color:var(--coral); flex:0 0 auto;}
  .date-card{border-radius:12px; padding:20px 18px; box-shadow:var(--shadow); text-align:start;}
  .date-card.tone-1{background:#faf1e2;}
  .date-card.tone-2{background:#fce9e9;}
  .date-card.tone-3{background:#e9ecfa;}
  .date-card .when{
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px; color:var(--coral); margin-bottom:8px; display:block;
  }
  html[dir="rtl"] .date-card .when{font-family:'Tajawal',sans-serif; font-size:17px;}
  .date-card h3{display:none;}
  .date-card p{font-family:'Jost',sans-serif; font-size:13px; color:var(--ink); margin:0; font-weight:500;}
  html[dir="rtl"] .date-card p{font-family:'Tajawal',sans-serif; font-size:13.5px;}

  /* Program cards (3 subjects) */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:var(--shadow); text-align:center;}
  .card .ic{font-size:30px; margin-bottom:10px;}
  .card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:17px; margin:0 0 8px; color:var(--emerald-d);}
  html[dir="rtl"] .card h3{font-family:'Tajawal',sans-serif; font-size:16px;}
  .card p{font-family:'Jost',sans-serif; font-size:12.5px; color:#5a6860; margin:0; line-height:1.7;}
  html[dir="rtl"] .card p{font-family:'Tajawal',sans-serif; font-size:13px;}

  /* Mission/Vision/Philosophy */
  .mvp-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px;}
  .mvp-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px 22px; box-shadow:var(--shadow);}
  .mvp-card .eyebrow{font-family:'Jost',sans-serif; font-size:11px; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:8px;}
  html[dir="rtl"] .mvp-card .eyebrow{font-family:'Tajawal',sans-serif; letter-spacing:0; text-transform:none;}
  .mvp-card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:18px; margin:0 0 10px; color:var(--ink);}
  html[dir="rtl"] .mvp-card h3{font-family:'Tajawal',sans-serif; font-size:16px;}
  .mvp-card p{font-family:'Jost',sans-serif; font-size:13px; color:#5a6860; margin:0;}
  html[dir="rtl"] .mvp-card p{font-family:'Tajawal',sans-serif; font-size:13.5px;}

  /* Team */
  .team-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:16px;}
  .team-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px 16px; box-shadow:var(--shadow); text-align:center;}
  .team-avatar{
    width:56px; height:56px; border-radius:50%; background:var(--emerald); color:#fff; display:flex; align-items:center;
    justify-content:center; margin:0 auto 12px; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:19px;
  }
  .team-card h3{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:15.5px; margin:0 0 4px; color:var(--ink);}
  html[dir="rtl"] .team-card h3{font-family:'Tajawal',sans-serif; font-size:14.5px;}
  .team-card .role{font-family:'Jost',sans-serif; font-size:11px; color:var(--emerald-d); font-weight:600;}
  html[dir="rtl"] .team-card .role{font-family:'Tajawal',sans-serif;}

  /* Portals */
  a.portal-card{
    display:block; background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px 18px;
    box-shadow:var(--shadow); text-align:center; text-decoration:none; color:inherit; transition:border-color .2s, transform .2s;
  }
  a.portal-card:hover{border-color:var(--gold); transform:translateY(-3px);}
  a.portal-card .ic{font-size:30px; margin-bottom:10px;}
  a.portal-card .title{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:16px; color:var(--emerald-d); margin-bottom:5px;}
  html[dir="rtl"] a.portal-card .title{font-family:'Tajawal',sans-serif; font-size:15px;}
  a.portal-card .desc{font-family:'Jost',sans-serif; font-size:11px; color:#5a6860; line-height:1.5;}
  html[dir="rtl"] a.portal-card .desc{font-family:'Tajawal',sans-serif;}

  /* CTA final */
  .final-cta{
    background:linear-gradient(135deg, var(--emerald) 0%, var(--emerald-d) 100%); border-radius:16px; padding:40px 26px;
    text-align:center; box-shadow:var(--shadow);
  }
  .final-cta h2{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:23px; margin:0 0 10px; color:#fff;}
  html[dir="rtl"] .final-cta h2{font-family:'Tajawal',sans-serif; font-size:20px;}
  .final-cta p{font-family:'Jost',sans-serif; font-size:13px; color:rgba(255,255,255,0.9); margin:0 0 20px;}
  html[dir="rtl"] .final-cta p{font-family:'Tajawal',sans-serif;}
  .final-cta .btn-primary{background:#fff; color:var(--emerald-d); box-shadow:none;}

  footer{background:#fff; border-top:1px solid var(--line); margin-top:70px; padding:34px 20px; text-align:center;}
  footer .foot-inner{max-width:1080px; margin:0 auto;}
  footer h4{font-family:'Cormorant Garamond',serif; font-size:17px; margin:0 0 10px; color:var(--emerald-d);}
  html[dir="rtl"] footer h4{font-family:'Tajawal',sans-serif;}
  footer p{font-family:'Jost',sans-serif; font-size:12.5px; color:#8a978f; margin:4px 0;}
  html[dir="rtl"] footer p{font-family:'Tajawal',sans-serif;}
  footer a.plink{color:var(--emerald-d); text-decoration:none;}
</style>
</head>
<body>

<div id="inAppBrowserBanner">
  <span id="bannerText"></span>
  <button class="close-banner" id="bannerClose" onclick="document.getElementById('inAppBrowserBanner').style.display='none'"></button>
</div>
<script>
  (function(){
    var ua = navigator.userAgent || '';
    if(/FBAN|FBAV|Instagram|WhatsApp|Line\/|Twitter|LinkedInApp|Snapchat/i.test(ua)){
      document.getElementById('inAppBrowserBanner').style.display = 'block';
    }
  })();
</script>

<nav class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <img src="https://madina.no/images/logo.png" alt="Madina Skole">
      <span class="brand-text" id="brandText">Madina Skole</span>
    </div>
    <div class="topbar-links" id="topbarLinks"></div>
    <div class="lang-switch-inner">
      <button id="btnLangNo" class="active" onclick="switchLang('no')">Norsk</button>
      <button id="btnLangAr" onclick="switchLang('ar')">العربية</button>
      <button id="btnLangUr" onclick="switchLang('ur')">اردو</button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="hero-inner">
  <a class="hero-badge" href="kunngjoring.html" id="heroBadge" style="text-decoration:none;"></a>
  <h1 id="heroTitle"></h1>
  <div class="school-year" id="heroYear"></div>
  <p class="lead" id="heroLead"></p>
  <div class="quick-facts" id="quickFacts"></div>
  <div class="hero-actions">
    <a class="btn btn-primary" href="index2.html" id="heroBtnPrimary"></a>
    <a class="btn btn-outline" href="#program" id="heroBtnOutline"></a>
  </div>
  </div>
</header>

<main>

  <section id="register">
    <div class="section-head">
      <div class="eyebrow" id="regEyebrow"></div>
      <h2 id="regTitle"></h2>
      <p id="regDesc"></p>
    </div>
    <div class="steps-row" id="stepsRow"></div>
    <div class="tuition-box" id="tuitionBox"></div>
  </section>

  <section id="dates">
    <div class="section-head">
      <div class="eyebrow" id="datesEyebrow"></div>
      <h2 id="datesTitle"></h2>
      <p id="datesDesc"></p>
    </div>
    <div class="dates-row" id="datesRow" style="display:block; text-align:center;"></div>
  </section>

  <section id="program">
    <div class="section-head">
      <div class="eyebrow" id="programEyebrow"></div>
      <h2 id="programTitle"></h2>
      <p id="programDesc"></p>
    </div>
    <div class="card-grid" id="programCards"></div>
  </section>

  <section id="who">
    <div class="section-head">
      <div class="eyebrow" id="whoEyebrow"></div>
      <h2 id="whoTitle"></h2>
      <p id="whoDesc"></p>
    </div>
    <div class="mvp-row" id="mvpRow"></div>
  </section>

  <section id="team">
    <div class="section-head">
      <div class="eyebrow" id="teamEyebrow"></div>
      <h2 id="teamTitle"></h2>
      <p id="teamDesc"></p>
    </div>
    <div class="team-row" id="teamRow"></div>
  </section>

  <section id="portals">
    <div class="section-head">
      <div class="eyebrow" id="portalsEyebrow"></div>
      <h2 id="portalsTitle"></h2>
      <p id="portalsDesc"></p>
    </div>
    <div class="card-grid" id="portalCards"></div>
  </section>

  <section id="cta">
    <div class="final-cta">
      <h2 id="ctaTitle"></h2>
      <p id="ctaDesc"></p>
      <a class="btn btn-primary" href="index2.html" id="ctaBtn"></a>
    </div>
  </section>

</main>

<footer>
  <div class="foot-inner">
    <h4 id="footerBrand"></h4>
    <p id="footerAddr"></p>
    <p id="footerContact"></p>
    <p id="footerOrgNr" style="font-size:11px;"></p>
    <p><a class="plink" href="personvern.html" id="footerPrivacy"></a></p>
    <p id="footerCopy"></p>
  </div>
</footer>

<script>
  const TEXT = {
    no: {
      pageTitle: 'Madina Skole', brand: 'Madina Skole',
      bannerText: '⚠️ Du åpnet denne siden inne i en app (f.eks. WhatsApp eller Instagram) — innlogging kan da feile. Trykk ⋯ eller del-ikonet og velg «Åpne i Safari».', bannerClose: 'Skjul',
      nav: { register:'Påmelding', dates:'Datoer', program:'Program', who:'Om oss', team:'Team', portals:'Portaler' },

      heroBadge: '📝 Påmelding er åpen', heroTitle: 'Koranundervisning, arabisk og urdu for barna våre', heroYear: 'Skoleåret 2026/2027',
      heroLead: 'En undervisningsskole tilknyttet Madina Institute Norway (Madina Grorud moske), som tilbyr koranmemorering, arabisk- og urduundervisning samt islamsk oppdragelse for barn og unge.',
      quickFacts: [
        { l:'Oppstart', v:'Uke 1 i september' },
        { l:'Undervisning', v:'Lørdager 09:30–13:30' },
        { l:'Madinabarn', v:'Søndager, 3–6 år' }
      ],
      heroBtnPrimary: '📝 Meld på nå', heroBtnOutline: 'Se programmet',

      regEyebrow: 'Påmelding', regTitle: 'Slik melder du deg på', regDesc: 'Tre enkle steg fra søknad til bekreftet plass.',

        { n:'عثمان', r:'اسکول لیڈر' },
        { n:'مریم حمدان', r:'ڈائریکٹر' },
        { n:'یاسر شرف', r:'تعلیمی و تدریسی سربراہ' },
        { n:'تولین حمدان', r:'مضمون کوآرڈینیٹر' }
      ],

      portalsEyebrow: 'الیکٹرانک پورٹلز', portalsTitle: 'پورٹلز تک رسائی', portalsDesc: 'ہر گروپ کے لیے اپنا مخصوص پورٹل موجود ہے۔',
      portals: [
        { ic:'🛡️', h:'انتظامیہ', p:'اسکول کے انتظامی امور کے لیے', href:'admin.html' },
        { ic:'📖', h:'اساتذہ کا پورٹل', p:'صرف اساتذہ کے لیے', href:'index1.html' },
        { ic:'👨‍👩‍👧', h:'والدین کا پورٹل', p:'نگرانی اور ادائیگی', href:'index4.html' },
        { ic:'📝', h:'داخلہ', p:'ابھی اپنے بچے کا داخلہ کروائیں', href:'index2.html' }
      ],

      ctaTitle: 'ہمارے ساتھ شامل ہونے کے لیے تیار ہیں؟', ctaDesc: 'جگہیں محدود ہیں — آج ہی اپنے بچے کا داخلہ کروائیں۔', ctaBtn: '📝 ابھی داخلہ لیں',

      footerBrand: 'مدینہ اسکول — مدینہ انسٹی ٹیوٹ ناروے', footerAddr: '📍 Hagelundveien 2B, 0963 Oslo', footerContact: '✉️ info@madinaskole.no',
      footerOrgNr: 'سرکاری رجسٹریشن نمبر: 919674431', footerPrivacy: 'رازداری کی پالیسی', footerCopy: '© مدینہ اسکول — جملہ حقوق محفوظ ہیں'
    }
  };

  const MUTAMMIM_VIDEO_URL = 'https://youtu.be/AwgsxvVi5Mw';
  function cardsHtml(list){
    return list.map(c => `<div class="card"><div class="ic">${c.ic}</div><h3>${c.h}</h3><p>${c.p}</p>${c.video ? `<p style="margin-top:10px;"><a href="${MUTAMMIM_VIDEO_URL}" target="_blank" rel="noopener" style="color:var(--emerald-d); text-decoration:none; font-weight:700;">${c.video}</a></p>` : ''}</div>`).join('');
  }
  function stepsHtml(list){ return list.map((s,i) => `<div class="step-card"><div class="step-num">${i+1}</div><h3>${s.h}</h3><p>${s.p}</p></div>`).join(''); }
  function calendarLinkHtml(d){
    return `<a class="calendar-link-card" href="timeplan.html"><span class="ic">📅</span><span class="txt"><h3>${d.h}</h3><p>${d.p}</p></span><span class="arrow">${document.getElementById('htmlRoot').getAttribute('dir')==='rtl' ? '←' : '→'}</span></a>`;
  }
  function mvpHtml(list){ return list.map(m => `<div class="mvp-card"><div class="eyebrow">${m.eyebrow}</div><h3>${m.h}</h3><p>${m.p}</p></div>`).join(''); }
  function teamHtml(list){
    return list.map(t => {
      const initials = t.n.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
      return `<div class="team-card"><div class="team-avatar">${initials}</div><h3>${t.n}</h3><div class="role">${t.r}</div></div>`;
    }).join('');
  }
  function portalsHtml(list){ return list.map(p => `<a class="portal-card" href="${p.href}"><div class="ic">${p.ic}</div><div class="title">${p.h}</div><div class="desc">${p.p}</div></a>`).join(''); }
  function quickFactsHtml(list){ return list.map(f => `<span class="quick-fact">${f.l}<b>${f.v}</b></span>`).join(''); }
  function navHtml(t){
    return `<a href="#register">${t.nav.register}</a><a href="#dates">${t.nav.dates}</a><a href="#program">${t.nav.program}</a><a href="#who">${t.nav.who}</a><a href="#team">${t.nav.team}</a><a href="#portals">${t.nav.portals}</a>`;
  }

  function switchLang(lang){
    const t = TEXT[lang];
    const isRtl = (lang === 'ar' || lang === 'ur');
    document.getElementById('htmlRoot').setAttribute('lang', lang);
    document.getElementById('htmlRoot').setAttribute('dir', isRtl ? 'rtl' : 'ltr');
    document.getElementById('btnLangNo').classList.toggle('active', lang === 'no');
    document.getElementById('btnLangAr').classList.toggle('active', lang === 'ar');
    document.getElementById('btnLangUr').classList.toggle('active', lang === 'ur');

    document.getElementById('pageTitle').textContent = t.pageTitle;
    document.getElementById('bannerText').textContent = t.bannerText;
    document.getElementById('bannerClose').textContent = t.bannerClose;
    document.getElementById('brandText').textContent = t.brand;
    document.getElementById('topbarLinks').innerHTML = navHtml(t);

    document.getElementById('heroBadge').textContent = t.heroBadge;
    document.getElementById('heroTitle').textContent = t.heroTitle;
    document.getElementById('heroYear').textContent = t.heroYear;
    document.getElementById('heroLead').textContent = t.heroLead;
    document.getElementById('quickFacts').innerHTML = quickFactsHtml(t.quickFacts);
    document.getElementById('heroBtnPrimary').textContent = t.heroBtnPrimary;
    document.getElementById('heroBtnOutline').textContent = t.heroBtnOutline;

    document.getElementById('regEyebrow').textContent = t.regEyebrow;
    document.getElementById('regTitle').textContent = t.regTitle;
    document.getElementById('regDesc').textContent = t.regDesc;
    document.getElementById('stepsRow').innerHTML = stepsHtml(t.steps);
    document.getElementById('tuitionBox').innerHTML = `
      <div class="tag">${t.tuitionTag}</div>
      <div class="amt">${t.tuitionAmt}</div>
      <div class="sub">${t.tuitionSub}</div>
      <ul>${t.tuitionList.map(i => '<li>' + i + '</li>').join('')}</ul>
      <a class="btn btn-primary" href="index2.html">${t.tuitionBtn}</a>`;

    document.getElementById('datesEyebrow').textContent = t.datesEyebrow;
    document.getElementById('datesTitle').textContent = t.datesTitle;
    document.getElementById('datesDesc').textContent = t.datesDesc;
    document.getElementById('datesRow').innerHTML = calendarLinkHtml(t.calendarLink);

    document.getElementById('programEyebrow').textContent = t.programEyebrow;
    document.getElementById('programTitle').textContent = t.programTitle;
    document.getElementById('programDesc').textContent = t.programDesc;
    document.getElementById('programCards').innerHTML = cardsHtml(t.programCards);

    document.getElementById('whoEyebrow').textContent = t.whoEyebrow;
    document.getElementById('whoTitle').textContent = t.whoTitle;
    document.getElementById('whoDesc').textContent = t.whoDesc;
    document.getElementById('mvpRow').innerHTML = mvpHtml(t.mvp);

    document.getElementById('teamEyebrow').textContent = t.teamEyebrow;
    document.getElementById('teamTitle').textContent = t.teamTitle;
    document.getElementById('teamDesc').textContent = t.teamDesc;
    document.getElementById('teamRow').innerHTML = teamHtml(t.team);

    document.getElementById('portalsEyebrow').textContent = t.portalsEyebrow;
    document.getElementById('portalsTitle').textContent = t.portalsTitle;
    document.getElementById('portalsDesc').textContent = t.portalsDesc;
    document.getElementById('portalCards').innerHTML = portalsHtml(t.portals);

    document.getElementById('ctaTitle').textContent = t.ctaTitle;
    document.getElementById('ctaDesc').textContent = t.ctaDesc;
    document.getElementById('ctaBtn').textContent = t.ctaBtn;

    document.getElementById('footerBrand').textContent = t.footerBrand;
    document.getElementById('footerAddr').textContent = t.footerAddr;
    document.getElementById('footerContact').textContent = t.footerContact;
    document.getElementById('footerOrgNr').textContent = t.footerOrgNr;
    document.getElementById('footerPrivacy').textContent = t.footerPrivacy;
    document.getElementById('footerCopy').textContent = t.footerCopy;

    localStorage.setItem('madinaHomeLang', lang);
  }

  (function(){
    const saved = localStorage.getItem('madinaHomeLang');
    switchLang((saved === 'ar' || saved === 'ur') ? saved : 'no');
  })();
</script>
