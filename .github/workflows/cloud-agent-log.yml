name: Update Cloud Agent Log

on:
  schedule:
    # Hver 10. time (UTC): 00:00, 10:00, 20:00
    - cron: "0 */10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-agent-log
  cancel-in-progress: false

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Oppdater CLOUD-AGENT-LOG.md
        run: node scripts/update-cloud-agent-log.js

      - name: Commit og push hvis endret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLOUD-AGENT-LOG.md
          if git diff --staged --quiet; then
            echo "Ingen endringer å committe."
            exit 0
          fi
          git commit -m "chore: auto-update CLOUD-AGENT-LOG (10h sync)"
          git push
