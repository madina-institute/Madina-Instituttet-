name: Deploy Cloud Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      # defineString() i index.js krever .env ved ikke-interaktiv deploy.
      # Hemmeligheter (VIPPS_CLIENT_ID osv.) ligger i Secret Manager —
      # dette er bare ikke-hemmelige driftsverdier som før lå i
      # .env.madina-instituttet.
      # VIPPS_MSN og VIPPS_ENV hentes fra GitHub Secrets (Settings → Secrets).
      # Legg inn produksjons-MSN der — aldri i koden.
      - name: Create functions .env for deploy
        working-directory: functions
        env:
          VIPPS_ENV: ${{ secrets.VIPPS_ENV }}
          VIPPS_MSN: ${{ secrets.VIPPS_MSN }}
        run: |
          if [ -z "$VIPPS_MSN" ]; then
            echo "::error::Mangler GitHub secret VIPPS_MSN (produksjons-MSN fra Vipps-portalen)."
            exit 1
          fi
          printf 'VIPPS_ENV=%s\nVIPPS_MSN=%s\nSITE_BASE_URL=https://madinaskole.no\n' "${VIPPS_ENV:-prod}" "$VIPPS_MSN" > .env

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        run: firebase deploy --only functions --project madina-instituttet --non-interactive --debug
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
