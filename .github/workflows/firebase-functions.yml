name: Deploy Cloud Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      # defineString() i index.js krever .env ved ikke-interaktiv deploy.
      # Hemmeligheter (VIPPS_CLIENT_ID osv.) ligger i Secret Manager —
      # dette er bare ikke-hemmelige driftsverdier som før lå i
      # .env.madina-instituttet.
      - name: Create functions .env for deploy
        working-directory: functions
        run: |
          cat > .env <<'EOF'
          VIPPS_ENV=test
          VIPPS_MSN=465281
          SITE_BASE_URL=https://madinaskole.no
          EOF

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        run: firebase deploy --only functions --project madina-instituttet --non-interactive --debug
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
